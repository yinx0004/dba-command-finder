# The comparison the site shows. Becomes the default once readers can pick databases.
pair:
  source: mysql
  target: mongodb

# Real lab results shown on the home page: for each database, its newest version the lab ran.
# A command outside its version range there shows as "fails as expected".
lab_excerpt:
  - {entry: replication-status, db: mysql, cmd: 'SHOW REPLICA STATUS\G'}
  - {entry: replication-status, db: mysql, cmd: 'SHOW SLAVE STATUS\G'}
  - {entry: binlog-retention, db: mysql, cmd: 'SELECT @@expire_logs_days;'}
  - {entry: replica-role, db: mongodb, cmd: db.hello()}
  - {entry: reclaim-space, db: mongodb, cmd: 'db.adminCommand({ autoCompact: true })'}
  - {entry: replication-status, db: mongodb, cmd: rs.printSlaveReplicationInfo()}
