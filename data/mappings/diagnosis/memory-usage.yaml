schema_version: 2
id: memory-usage
category: diagnosis
title: {zh: 查看内存占用}
summary: {zh: 实例内存涨得厉害时，看总共用了多少、主要被什么占着。}
keywords:
  zh: [内存占用, 内存使用, 内存泄漏, 内存多少]
  en: [memory, memory_global_total, resident, tcmalloc, INFO memory, MEMORY STATS, used_memory]
fields:
  - {id: total, name: {zh: 总共占用}}
databases:
  mysql:
    support: full
    commands:
      - cmd: SELECT * FROM sys.memory_global_total;
        note: {zh: performance_schema 统计到的总分配量}
      - cmd: SELECT * FROM sys.memory_global_by_current_bytes LIMIT 10;
        note: {zh: 按用途列出占用最多的内存}
    fields:
      total: total_allocated
    notes:
      - zh: 只统计打开了 instrument 的内存分配；5.7 默认大部分内存 instrument 没开，数字会明显偏小，8.0 起默认开启。
    refs:
      - {title: 'MySQL: sys.memory_global_by_current_bytes', url: 'https://dev.mysql.com/doc/refman/8.4/en/sys-memory-global-by-current-bytes.html'}
  mongodb:
    support: partial
    commands:
      - cmd: db.serverStatus().mem
        note: {zh: 进程常驻内存（resident）和虚拟内存，单位 MB}
      - cmd: db.serverStatus().tcmalloc
        note: {zh: 内存分配器的细节，例如已分配但还没还给系统的部分}
    fields:
      total: {name: resident, note: {zh: 单位 MB，是操作系统看到的进程内存}}
    notes:
      - zh: 主要的内存消耗是 WiredTiger 缓存，看「查看缓存命中率」里的 bytes currently in the cache。
    refs:
      - {title: 'MongoDB: serverStatus mem', url: 'https://www.mongodb.com/docs/manual/reference/command/serverStatus/#mem'}
  redis:
    support: full
    commands:
      - cmd: INFO memory
        note:
          zh: used_memory 是数据占用，used_memory_rss 是操作系统看到的进程内存，两者之比是 mem_fragmentation_ratio
      - cmd: MEMORY STATS
      - cmd: MEMORY DOCTOR
        note:
          zh: 用文字指出内存方面的问题，例如碎片太多
    fields:
      total: used_memory
    refs:
      - {title: 'Redis: MEMORY STATS', url: 'https://redis.io/docs/latest/commands/memory-stats/'}
      - {title: 'Redis: INFO', url: 'https://redis.io/docs/latest/commands/info/'}
  postgresql:
    support: partial
    commands:
      - cmd: SHOW shared_buffers;
        note:
          zh: 共享缓存，启动时一次分配
      - cmd: SELECT pg_size_pretty(sum(allocated_size)) AS total FROM pg_shmem_allocations;
        note:
          zh: 共享内存一共分出去多少
      - cmd: SELECT name, pg_size_pretty(total_bytes) AS total_bytes FROM pg_backend_memory_contexts ORDER BY total_bytes DESC LIMIT 5;
        note:
          zh: 当前这个连接自己用了多少内存
    fields:
      total: total
    notes:
      - zh: 每个连接是一个独立进程，排序、哈希另外按 work_mem 申请内存；没有一个视图能看全实例所有进程的内存。
    refs:
      - {title: 'PostgreSQL: pg_shmem_allocations', url: 'https://www.postgresql.org/docs/current/view-pg-shmem-allocations.html'}
      - {title: 'PostgreSQL: pg_backend_memory_contexts', url: 'https://www.postgresql.org/docs/current/view-pg-backend-memory-contexts.html'}
  tidb:
    support: full
    commands:
      - cmd: SELECT * FROM information_schema.CLUSTER_MEMORY_USAGE;
        note:
          zh: 每台 tidb-server 的内存上限、当前用量和历史最高
      - cmd: SELECT INSTANCE, ID, USER, MEM, DISK, INFO FROM information_schema.CLUSTER_PROCESSLIST ORDER BY MEM DESC LIMIT 10;
        note:
          zh: 哪些会话占用内存最多
    fields:
      total: MEMORY_CURRENT
    notes:
      - zh: 超过 tidb_server_memory_limit 时，tidb-server 会取消占用内存最多的语句。TiKV 的内存看 Grafana。
    refs:
      - {title: 'TiDB: MEMORY_USAGE', url: 'https://docs.pingcap.com/tidb/stable/information-schema-memory-usage/'}
      - {title: 'TiDB: PROCESSLIST', url: 'https://docs.pingcap.com/tidb/stable/information-schema-processlist/'}
related: [cache-hit-ratio, server-status]
