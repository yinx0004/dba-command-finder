schema_version: 2
id: running-query-plan
category: diagnosis
title: {zh: 查看正在执行的查询用了什么执行计划}
summary: {zh: 某条查询正在跑、迟迟不结束时，不用等它结束，直接看它走了哪个索引。}
keywords:
  zh: [正在执行的执行计划, 运行中的查询, 卡住的查询走了什么索引]
  en: [explain for connection, planSummary, running query plan]
fields:
  - {id: plan, name: {zh: 执行计划}}
databases:
  mysql:
    support: full
    commands:
      - cmd: EXPLAIN FOR CONNECTION <processlist_id>;
        skip: {zh: 需要另一个连接上正好有一条在执行的查询}
        note: {zh: processlist_id 从 SHOW PROCESSLIST 里取}
    refs:
      - {title: 'MySQL: EXPLAIN FOR CONNECTION', url: 'https://dev.mysql.com/doc/refman/8.4/en/explain-for-connection.html'}
  mongodb:
    support: partial
    commands:
      - cmd: 'db.currentOp({ active: true, planSummary: { $exists: true } })'
        note: {zh: '每个正在执行的查询都带着 planSummary，例如 IXSCAN { a: 1 } 或 COLLSCAN'}
    fields:
      plan: {name: planSummary, skip: {zh: 需要另一个连接上正好有一条在执行的查询}}
    notes:
      - zh: planSummary 只是摘要；要看完整计划，拿 currentOp 里的 command 重新 explain 一次。
    refs:
      - {title: 'MongoDB: db.currentOp()', url: 'https://www.mongodb.com/docs/manual/reference/method/db.currentOp/'}
  redis:
    support: none
    notes:
      - zh: 没有查询优化器，也就没有执行计划：每个命令怎么执行是固定的，复杂度写在命令文档里（例如 HGET 是 O(1)，SMEMBERS 是 O(N)）。
    alternatives:
      - title: {zh: 看正在执行的连接最近执行的命令（cmd）}
        cmd: CLIENT LIST
  postgresql:
    support: partial
    commands:
      - cmd: LOAD 'auto_explain';
      - cmd: SET auto_explain.log_min_duration = '1s';
        note:
          zh: 之后这个连接里超过 1 秒的语句，执行计划会写进服务器日志
    notes:
      - zh: 看不到别的连接正在执行的语句用的计划；auto_explain 只能事后从日志里看，要对所有连接生效，把它加进 session_preload_libraries。
    refs:
      - {title: 'PostgreSQL: auto_explain', url: 'https://www.postgresql.org/docs/current/auto-explain.html'}
  tidb:
    support: full
    commands:
      - cmd: EXPLAIN FOR CONNECTION <processlist_id>;
        skip: {zh: 需要另一个连接上正好有一条在执行的查询}
        note:
          zh: 连接 id 从 SHOW PROCESSLIST 看，要在那条连接所在的 tidb-server 上执行
    notes:
      - zh: 已经结束的慢查询，执行计划在 SLOW_QUERY 的 Plan 列里，用 SELECT tidb_decode_plan(Plan) 解开。
    refs:
      - {title: 'TiDB: EXPLAIN', url: 'https://docs.pingcap.com/tidb/stable/sql-statement-explain/'}
related: [list-active-sessions, explain]
