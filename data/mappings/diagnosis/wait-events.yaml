schema_version: 2
id: wait-events
category: diagnosis
title: {zh: 查看实例在等什么}
summary: {zh: 实例变慢但 CPU 不高时，看时间主要花在等锁、等 IO 还是等别的。}
keywords:
  zh: [等待事件, 在等什么, 等待, 排队]
  en: [wait events, waits_global_by_latency, globallock, currentqueue]
databases:
  mysql:
    support: full
    commands:
      - cmd: SELECT * FROM sys.waits_global_by_latency LIMIT 10;
        note: {zh: 按累计等待时间排序的等待事件}
      - cmd: SELECT * FROM sys.wait_classes_global_by_latency;
        note: {zh: 按大类（IO、锁、同步）汇总}
    refs:
      - {title: 'MySQL: sys.waits_global_by_latency', url: 'https://dev.mysql.com/doc/refman/8.4/en/sys-waits-global-by-latency.html'}
  mongodb:
    support: partial
    commands:
      - cmd: db.serverStatus().globalLock
        note: {zh: 正在排队等锁的读写请求数（currentQueue）}
      - cmd: db.serverStatus().locks
        note: {zh: 各级锁的获取次数、等待次数和等待时间}
    notes:
      - zh: 没有按等待事件分类统计的视图。最接近的是锁的排队和等待时间；WiredTiger 内部的等待（例如等缓存腾出空间）在 serverStatus().wiredTiger 的各项计数里。
    refs:
      - {title: 'MongoDB: serverStatus', url: 'https://www.mongodb.com/docs/manual/reference/command/serverStatus/'}
  redis:
    support: partial
    commands:
      - cmd: CONFIG SET latency-monitor-threshold 100
        note:
          zh: 单位是毫秒，超过就记录；默认 0 表示不记录
      - cmd: LATENCY LATEST
        note:
          zh: 每类事件最近一次和最长一次的耗时，事件如 command、fork、aof-fsync-always、expire-cycle
      - cmd: LATENCY DOCTOR
        note:
          zh: 用文字分析延迟从哪来、怎么处理
    notes:
      - zh: 没有等待事件的概念，命令执行时不会等锁或等 IO。LATENCY 监控记录的是让整个实例卡住的事件，例如 fork 生成快照、AOF 刷盘、集中过期。
    verify:
      teardown: CONFIG SET latency-monitor-threshold 0
  postgresql:
    support: partial
    commands:
      - cmd: SELECT wait_event_type, wait_event, count(*) AS sessions FROM pg_stat_activity WHERE wait_event IS NOT NULL GROUP BY 1, 2 ORDER BY 3 DESC;
        note:
          zh: 此刻每个连接在等什么，例如 Lock、IO、LWLock
      - cmd: SELECT type, name, description FROM pg_wait_events WHERE type = 'IO' LIMIT 5;
        since: '17'
        note:
          zh: 每种等待事件的说明
    notes:
      - zh: 只有此刻的快照，没有累计的等待时间；要看趋势，得定期采样 pg_stat_activity。
  tidb:
    support: partial
    commands:
      - cmd: SELECT Time, Query_time, Backoff_time, Backoff_types, LockKeys_time, Query FROM information_schema.SLOW_QUERY ORDER BY Query_time DESC LIMIT 10;
        note:
          zh: 慢查询花在重试（Backoff）和等锁上的时间
      - cmd: SELECT INSTANCE, SESSION_ID, STATE, WAITING_START_TIME, CURRENT_SQL_DIGEST_TEXT FROM information_schema.CLUSTER_TIDB_TRX WHERE STATE = 'LockWaiting';
        note:
          zh: 正在等锁的事务
    notes:
      - zh: 没有等待事件的统计。一条 SQL 的时间花在哪，看 EXPLAIN ANALYZE 的 execution info、慢查询日志，或者 Grafana 的 TiDB → Query Duration 拆分。
related: [lock-waits, cache-hit-ratio]
