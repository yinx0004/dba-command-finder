schema_version: 2
id: live-throughput
category: diagnosis
title: {zh: 实时观察每秒吞吐}
summary: {zh: 像看 top 一样，每秒刷新一次请求量、写入量和连接数，确认负载是不是突然变了。}
keywords:
  zh: [每秒吞吐, 实时监控, QPS, TPS, 负载突增]
  en: [mongostat, mysqladmin extended-status, qps, tps, throughput]
fields:
  - {id: queries, name: {zh: 每秒查询}}
  - {id: inserts, name: {zh: 每秒插入}}
  - {id: connections, name: {zh: 连接}}
databases:
  mysql:
    support: full
    commands:
      - cmd: mysqladmin -r -i 1 -c 2 extended-status | grep -E 'Questions|Com_select|Com_insert|Threads_connected|Threads_running'
        shell: true
        note: {zh: -i 1 每秒一次，-c 2 共两次；-r 显示和上一次的差值，第一组是累计值，第二组起才是每秒增量}
    fields:
      queries: Questions
      inserts: Com_insert
      connections: Threads_connected
    refs:
      - {title: 'MySQL: mysqladmin', url: 'https://dev.mysql.com/doc/refman/8.4/en/mysqladmin.html'}
  mongodb:
    support: partial
    commands:
      - cmd: mongostat -n 2 1
        shell: true
        note: {zh: 每秒一行、共两行；去掉 -n 会一直刷新}
    fields:
      queries: query
      inserts: insert
      connections: conn
    notes:
      - zh: 每行直接就是每秒的量。dirty、used 两列是 WiredTiger 缓存的脏数据和使用比例，qrw、arw 是排队和正在执行的读写数，一屏就能看出是不是卡在缓存或锁上。
    refs:
      - {title: 'MongoDB: mongostat', url: 'https://www.mongodb.com/docs/database-tools/mongostat/'}
  redis:
    support: partial
    commands:
      - cmd: redis-cli -r 2 -i 1 INFO stats | grep -E 'instantaneous_ops_per_sec|total_commands_processed'
        shell: true
        note:
          zh: 每秒采一次，共两次；instantaneous_ops_per_sec 是最近一段时间的每秒命令数
      - cmd: INFO clients
    fields:
      queries: instantaneous_ops_per_sec
      connections: connected_clients
    notes:
      - zh: 没有按读写分开的每秒计数；要按命令看，比较两次 INFO commandstats 里各命令 calls 的差值。redis-cli --stat 会一直滚动输出每秒概况，适合在终端里盯着看。
  postgresql:
    support: partial
    commands:
      - cmd: SELECT sum(xact_commit + xact_rollback) AS xact_commit, sum(tup_inserted) AS tup_inserted, sum(numbackends) AS numbackends FROM pg_stat_database;
        note:
          zh: 都是累计值，隔一秒采两次相减就是每秒的量
      - cmd: for i in 1 2; do psql -At -c 'SELECT sum(xact_commit + xact_rollback) FROM pg_stat_database'; sleep 1; done
        shell: true
        note:
          zh: 采两次，后一次减前一次就是这一秒的事务数
    fields:
      queries: xact_commit
      inserts: tup_inserted
      connections: numbackends
    notes:
      - zh: 在 psql 里可以用 \watch 1 每秒重跑一次查询。
  tidb:
    support: partial
    commands:
      - cmd: SELECT * FROM METRICS_SCHEMA.tidb_qps WHERE time = NOW();
        on: [pd]
        note:
          zh: 从 Prometheus 查询当前每秒的语句数，按类型分开
      - cmd: SELECT INSTANCE, COUNT(*) AS running FROM information_schema.CLUSTER_PROCESSLIST WHERE COMMAND <> 'Sleep' GROUP BY INSTANCE;
        note:
          zh: 每台 tidb-server 上正在执行的语句数
    notes:
      - zh: 没有 Com_*、Questions 这类计数，mysqladmin extended-status 看不出吞吐。实时吞吐看 Grafana 的 TiDB → Query Summary 面板。
related: [server-status, hot-tables]
