schema_version: 2
id: hot-tables
category: diagnosis
title: {zh: 找出最忙的表}
summary: {zh: 看读写时间主要花在哪几张表（集合）上，定位热点。}
keywords:
  zh: [最忙的表, 热点表, 哪张表最忙, 表的读写]
  en: [mongotop, schema_table_statistics, hot table, latencystats]
fields:
  - {id: table, name: {zh: 表（集合）}}
  - {id: total_time, name: {zh: 总耗时}}
  - {id: read_time, name: {zh: 读耗时}}
  - {id: write_time, name: {zh: 写耗时}}
databases:
  mysql:
    support: full
    commands:
      - cmd: SELECT * FROM sys.schema_table_statistics LIMIT 10;
        note: {zh: 自启动以来每张表的累计读写行数和耗时，按总耗时排序}
    fields:
      table: table_name
      total_time: total_latency
      read_time: fetch_latency
      write_time: {name: insert_latency, note: {zh: 写入按 insert / update / delete 分开统计}}
    refs:
      - {title: 'MySQL: sys.schema_table_statistics', url: 'https://dev.mysql.com/doc/refman/8.4/en/sys-schema-table-statistics.html'}
    verify:
      setup: CREATE TABLE t (id INT PRIMARY KEY, a INT); INSERT INTO t VALUES (1, 1), (2, 2); SELECT * FROM t WHERE a = 1;
  mongodb:
    support: partial
    commands:
      - cmd: mongotop -n 1 1
        shell: true
        note: {zh: 每个集合在这 1 秒里花在读写上的时间；去掉 -n 会一直刷新}
      - cmd: 'db.<collection>.aggregate([{ $collStats: { latencyStats: {} } }])'
        note: {zh: 某个集合自启动以来的累计读写次数和延迟}
    fields:
      table: ns
      total_time: total
      read_time: read
      write_time: write
    notes:
      - zh: mongotop 看的是采样间隔内的时间，sys.schema_table_statistics 是自启动以来的累计值；要看 MongoDB 的累计值，用 $collStats 的 latencyStats。
    refs:
      - {title: 'MongoDB: mongotop', url: 'https://www.mongodb.com/docs/database-tools/mongotop/'}
    verify:
      setup: 'db.t.insertMany([{ a: 1 }, { a: 2 }]); db.t.find({ a: 1 }).toArray()'
      vars: {collection: t}
  redis:
    support: partial
    commands:
      - cmd: redis-cli --hotkeys
        shell: true
        note:
          zh: 找出访问最频繁的键，要求 maxmemory-policy 是 LFU 类（allkeys-lfu 或 volatile-lfu）
      - cmd: redis-cli --bigkeys
        shell: true
        note:
          zh: 找出每种类型里最大的键；大键往往也是最忙的键
    notes:
      - zh: 没有表，对应的是热点键。--hotkeys、--bigkeys 都用 SCAN 遍历整个键空间，键很多时会跑一阵，但不会长时间挡住其他命令。
    refs:
      - {title: 'Redis: redis-cli', url: 'https://redis.io/docs/latest/develop/tools/cli/'}
    verify:
      setup: CONFIG SET maxmemory-policy allkeys-lfu
      teardown: CONFIG SET maxmemory-policy noeviction
  postgresql:
    support: partial
    commands:
      - cmd: SELECT relname, seq_scan, idx_scan, n_tup_ins, n_tup_upd, n_tup_del FROM pg_stat_user_tables ORDER BY n_tup_ins + n_tup_upd + n_tup_del DESC LIMIT 10;
        note:
          zh: 按表看读写次数
      - cmd: SELECT relname, heap_blks_read, heap_blks_hit, idx_blks_read FROM pg_statio_user_tables ORDER BY heap_blks_read DESC LIMIT 10;
        note:
          zh: 按表看读了多少数据块
    fields:
      table: relname
    notes:
      - zh: 只有次数和块数，没有按表统计的耗时。
    refs:
      - {title: 'PostgreSQL: pg_stat_all_tables', url: 'https://www.postgresql.org/docs/current/monitoring-stats.html#MONITORING-PG-STAT-ALL-TABLES-VIEW'}
      - {title: 'PostgreSQL: pg_statio_all_tables', url: 'https://www.postgresql.org/docs/current/monitoring-stats.html#MONITORING-PG-STATIO-ALL-TABLES-VIEW'}
  tidb:
    support: partial
    commands:
      - cmd: SELECT TABLE_NAMES, SUM(EXEC_COUNT) AS exec_count, SUM(SUM_LATENCY) AS total_latency FROM information_schema.CLUSTER_STATEMENTS_SUMMARY GROUP BY TABLE_NAMES ORDER BY total_latency DESC LIMIT 10;
        note:
          zh: 按语句涉及的表汇总执行次数和总耗时（纳秒）
      - cmd: SELECT DB_NAME, TABLE_NAME, INDEX_NAME, TYPE, MAX_HOT_DEGREE, FLOW_BYTES FROM information_schema.TIDB_HOT_REGIONS ORDER BY FLOW_BYTES DESC LIMIT 10;
        on: [pd]
        note:
          zh: 读写流量最大的 Region 属于哪张表、哪个索引；TYPE 是 read 或 write
    fields:
      table: TABLE_NAMES
      total_time: total_latency
    notes:
      - zh: 写入集中在一张表的同一段主键上（自增主键、时间戳）会形成写热点，可以改用 AUTO_RANDOM 或 SHARD_ROW_ID_BITS 打散。图形化的热点分布看 TiDB Dashboard 的流量可视化。
    refs:
      - {title: 'TiDB: TIDB_HOT_REGIONS', url: 'https://docs.pingcap.com/tidb/stable/information-schema-tidb-hot-regions/'}
      - {title: 'TiDB: Statement Summary Tables', url: 'https://docs.pingcap.com/tidb/stable/statement-summary-tables/'}
    verify:
      setup: CREATE TABLE t (id INT PRIMARY KEY, a INT); INSERT INTO t VALUES (1, 1), (2, 2); SELECT * FROM t WHERE a = 1;
related: [live-throughput, top-statements, table-size]
