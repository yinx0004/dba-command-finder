schema_version: 2
id: check-table
category: maintenance
title: {zh: 检查表是否损坏}
summary: {zh: 怀疑数据或索引损坏时（例如异常关机后），检查表（集合）的结构和索引是否一致。}
keywords:
  zh: [检查表, 表损坏, 数据损坏, 校验]
  en: [check table, mysqlcheck, validate, corruption]
fields:
  - {id: result, name: {zh: 检查结果}}
  - {id: problems, name: {zh: 问题}}
databases:
  mysql:
    support: full
    commands:
      - cmd: CHECK TABLE <table>;
      - cmd: CHECK TABLE <table> EXTENDED;
        note: {zh: 更彻底，也更慢}
      - cmd: mysqlcheck --check --all-databases
        shell: true
        skip: {zh: 官方 MySQL 镜像不带 mysqlcheck}
        note: {zh: 检查整个实例}
    fields:
      result: Msg_text
      problems: Msg_type
    notes:
      - zh: InnoDB 表检查出问题时，服务器可能为了防止错误扩散而直接关闭，生产上要谨慎执行。
    refs:
      - {title: 'MySQL: CHECK TABLE', url: 'https://dev.mysql.com/doc/refman/8.4/en/check-table.html'}
    verify:
      setup: CREATE TABLE t (id INT PRIMARY KEY, a INT, KEY idx_a (a)); INSERT INTO t VALUES (1, 1);
      vars: {table: t}
  mongodb:
    support: partial
    commands:
      - cmd: db.<collection>.validate()
      - cmd: 'db.<collection>.validate({ full: true })'
        note: {zh: 更彻底，也更慢}
      - cmd: 'db.<collection>.validate({ background: true })'
        since: '4.4'
        note: {zh: 不阻塞读写；检查的是最近一次检查点的数据}
    fields:
      result: valid
      problems: errors
    notes:
      - zh: '默认的 validate 执行期间会阻塞这个集合的读写；大集合在生产上用 background: true，或者在从节点上检查。'
      - zh: 'background: true 检查的是最近一次检查点（默认约每分钟一次）的数据。lab 实测：8.0 上刚创建、还没做过检查点的集合会报「does not exist」，可以先执行 db.adminCommand({ fsync: 1 }) 强制做一次检查点。'
    refs:
      - {title: 'MongoDB: validate', url: 'https://www.mongodb.com/docs/manual/reference/command/validate/'}
    verify:
      # background validation reads the last checkpoint, so force one after creating the collection
      setup: 'db.t.insertOne({ a: 1 }); db.t.createIndex({ a: 1 }); db.adminCommand({ fsync: 1 })'
      vars: {collection: t}
  redis:
    support: partial
    commands:
      - cmd: redis-check-rdb /data/dump.rdb
        shell: true
        note:
          zh: 检查 RDB 快照文件是否完整
      - cmd: redis-check-aof --fix <aof_file>
        shell: true
        skip: {zh: 要先停掉 Redis 再修复 AOF 文件，lab 没法在运行中验证}
        note:
          zh: AOF 文件末尾不完整时（例如写到一半宕机），截掉坏掉的部分
    fields:
      result: {name: RDB looks OK 之类的检查结论}
    notes:
      - zh: 内存里的数据没有“损坏”一说，要检查的是磁盘上的快照和 AOF 文件。
    refs:
      - {title: 'Redis: Persistence', url: 'https://redis.io/docs/latest/operate/oss_and_stack/management/persistence/'}
    verify:
      setup_shell: redis-cli SAVE
  postgresql:
    support: full
    commands:
      - cmd: SELECT bt_index_check('<index>');
        note:
          zh: 检查 B-tree 索引是否损坏，要先 CREATE EXTENSION amcheck；没问题时不返回内容
      - cmd: pg_amcheck -d <db>
        shell: true
        note:
          zh: 检查整个库的表和索引，有问题才输出
    fields:
      result: {name: 没有输出就是没发现问题}
    refs:
      - {title: 'PostgreSQL: amcheck', url: 'https://www.postgresql.org/docs/current/amcheck.html'}
      - {title: 'PostgreSQL: pg_amcheck', url: 'https://www.postgresql.org/docs/current/app-pgamcheck.html'}
    verify:
      setup: |-
        CREATE EXTENSION IF NOT EXISTS amcheck;
        CREATE TABLE t (id int PRIMARY KEY, a int);
        INSERT INTO t SELECT g, g % 10 FROM generate_series(1, 1000) g;
      vars: {index: t_pkey}
  tidb:
    support: full
    commands:
      - cmd: ADMIN CHECK TABLE <table>;
        note:
          zh: 检查数据和所有索引是否一致；一致时没有输出，不一致时报错
      - cmd: ADMIN CHECK INDEX <table> <index>;
    notes:
      - zh: 不支持 CHECK TABLE。数据的物理完整性由 TiKV 的校验和多副本保证，这里检查的是表数据和索引之间的一致性。
    refs:
      - {title: 'TiDB: ADMIN CHECK [TABLE|INDEX]', url: 'https://docs.pingcap.com/tidb/stable/sql-statement-admin-check-table-index/'}
    verify:
      setup: CREATE TABLE t (id INT PRIMARY KEY, a INT, KEY idx_a (a)); INSERT INTO t VALUES (1, 1);
      vars: {table: t, index: idx_a}
related: [reclaim-space]
