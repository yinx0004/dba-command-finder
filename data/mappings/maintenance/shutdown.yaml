schema_version: 2
id: shutdown
category: maintenance
title: {zh: 关闭实例}
summary: {zh: 干净地关闭数据库实例，例如升级或迁移之前。}
keywords:
  zh: [关机, 关闭数据库, 停库, 停止实例]
  en: [shutdown, shutdownserver, mysqladmin shutdown, stop]
databases:
  mysql:
    support: full
    commands:
      - cmd: SHUTDOWN;
        since: 5.7.9
        skip: {zh: 会关掉 lab 的实例}
      - cmd: mysqladmin shutdown
        shell: true
        skip: {zh: 会关掉 lab 的实例}
    notes:
      - zh: innodb_fast_shutdown 决定关机时做多少清理：默认 1 较快；升级大版本前通常设为 0，做完整清理。
    refs:
      - {title: 'MySQL: SHUTDOWN', url: 'https://dev.mysql.com/doc/refman/8.4/en/shutdown.html'}
  mongodb:
    support: partial
    commands:
      - cmd: db.getSiblingDB("admin").shutdownServer()
        skip: {zh: 会关掉 lab 的实例}
      - cmd: 'db.adminCommand({ shutdown: 1, timeoutSecs: 60 })'
        skip: {zh: 会关掉 lab 的实例}
        note: {zh: 主节点最多等 60 秒让从节点追上再关}
    notes:
      - zh: '副本集的主节点关闭前会等可选举的从节点追上，等不到就失败；确实要关，加 force: true（可能丢掉还没复制过去的写入）。'
      - zh: 计划内维护一般先 rs.stepDown() 把主节点切走，再关原来的主节点。
    refs:
      - {title: 'MongoDB: shutdown', url: 'https://www.mongodb.com/docs/manual/reference/command/shutdown/'}
  redis:
    support: full
    commands:
      - cmd: SHUTDOWN
        skip: {zh: 会关掉 lab 的实例}
        note:
          zh: 配了快照时先保存一次再退出；开着 AOF 时先刷盘
      - cmd: SHUTDOWN NOSAVE
        skip: {zh: 会关掉 lab 的实例}
        note:
          zh: 不保存直接退出，上次快照之后的写入会丢
    notes:
      - zh: 7.0 起，有从库时主库会先等从库追上（最多 shutdown-timeout 秒）再退出。
    refs:
      - {title: 'Redis: SHUTDOWN', url: 'https://redis.io/docs/latest/commands/shutdown/'}
  postgresql:
    support: partial
    commands:
      - cmd: pg_ctl stop -D "$PGDATA" -m fast
        shell: true
        skip: {zh: 会关掉 lab 的实例}
        note:
          zh: fast 断开所有连接、回滚没提交的事务后正常关闭；smart 等所有连接自己断开；immediate 直接退出，下次启动要做恢复
    notes:
      - zh: 没有关闭实例的 SQL 命令，要在服务器上用 pg_ctl 或 systemctl。
    refs:
      - {title: 'PostgreSQL: pg_ctl', url: 'https://www.postgresql.org/docs/current/app-pg-ctl.html'}
      - {title: 'PostgreSQL: Shutting Down the Server', url: 'https://www.postgresql.org/docs/current/server-shutdown.html'}
  tidb:
    support: full
    commands:
      - cmd: SHUTDOWN;
        skip: {zh: 会把 lab 正在用的 tidb-server 关掉}
        note:
          zh: 只关掉当前连着的这一台 tidb-server，其他节点照常服务
      - cmd: tiup cluster stop <cluster>
        shell: true
        skip: {zh: 需要单独安装的 TiDB 工具和真实集群，lab 里没有}
        note:
          zh: 按顺序停掉整个集群；只停某类节点加 -R tidb、-R tikv
    refs:
      - {title: 'TiDB: SHUTDOWN', url: 'https://docs.pingcap.com/tidb/stable/sql-statement-shutdown/'}
      - {title: 'TiDB: tiup cluster stop', url: 'https://docs.pingcap.com/tidb/stable/tiup-component-cluster-stop/'}
related: [rotate-logs]
