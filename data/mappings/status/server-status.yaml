schema_version: 2
id: server-status
category: status
title: {zh: 查看服务器状态计数}
summary: {zh: 查看连接数、请求量、网络流量、缓存命中等累计计数，是做监控和看负载的起点。}
keywords:
  zh: [状态, 计数器, 连接数, QPS, 负载]
  en: [status, counters, serverstatus]
fields:
  - id: connections
    name: {zh: 当前连接数}
  - id: uptime
    name: {zh: 运行时长}
  - id: operations
    name: {zh: 各类操作计数}
  - id: network_bytes
    name: {zh: 网络收发字节}
  - id: cache
    name: {zh: 缓存指标}
databases:
  mysql:
    support: full
    commands:
      - cmd: SHOW GLOBAL STATUS;
      - cmd: SHOW GLOBAL STATUS LIKE 'Threads_%';
        note: {zh: 用 LIKE 过滤}
    fields:
      connections: Threads_connected
      uptime: Uptime
      operations: Com_select / Com_insert / …
      network_bytes: Bytes_received / Bytes_sent
      cache: Innodb_buffer_pool_*
    refs:
      - title: 'MySQL: SHOW STATUS'
        url: https://dev.mysql.com/doc/refman/8.4/en/show-status.html
  mongodb:
    support: partial
    commands:
      - cmd: db.serverStatus()
      - cmd: db.serverStatus().connections
        note: {zh: 用点路径取其中一部分}
    fields:
      connections: connections.current
      uptime: uptime
      operations: opcounters
      network_bytes: network.bytesIn / network.bytesOut
      cache:
        name: wiredTiger.cache
        note: {zh: 缓存相关指标}
    notes:
      - zh: 计数器从进程启动开始累计，算速率要取两次结果的差值，这一点和 MySQL 一样。
      - zh: 结果是嵌套文档而不是名值对，没有 LIKE 过滤，用点路径取子字段。
      - zh: 没有 FLUSH STATUS 这样重置计数器的命令。
    refs:
      - title: 'MongoDB: serverStatus'
        url: https://www.mongodb.com/docs/manual/reference/command/serverStatus/
  redis:
    support: full
    commands:
      - cmd: INFO
        note:
          zh: 默认几个分区一起列出；INFO everything 列出全部
      - cmd: INFO stats
      - cmd: INFO commandstats
        note:
          zh: 按命令统计调用次数和耗时
    fields:
      connections: connected_clients
      uptime: uptime_in_seconds
      operations: total_commands_processed
      network_bytes: total_net_input_bytes / total_net_output_bytes
      cache: {name: keyspace_hits / keyspace_misses, note: {zh: 数据都在内存里，这里是读到和没读到键的次数}}
    refs:
      - {title: 'Redis: INFO', url: 'https://redis.io/docs/latest/commands/info/'}
  postgresql:
    support: partial
    commands:
      - cmd: SELECT datname, numbackends, xact_commit, xact_rollback, blks_read, blks_hit, tup_returned, tup_inserted, tup_updated, tup_deleted FROM pg_stat_database WHERE datname = current_database();
        note:
          zh: 按库累计的计数，从上次重置统计起算
      - cmd: SELECT now() - pg_postmaster_start_time() AS uptime;
    fields:
      connections: numbackends
      uptime: uptime
      operations: xact_commit / xact_rollback
      cache: blks_hit / blks_read
    notes:
      - zh: 没有网络流量计数；统计分散在 pg_stat_database、pg_stat_bgwriter、pg_stat_wal 等多张视图里。
    refs:
      - {title: 'PostgreSQL: pg_stat_database', url: 'https://www.postgresql.org/docs/current/monitoring-stats.html#MONITORING-PG-STAT-DATABASE-VIEW'}
      - {title: 'PostgreSQL: System Information Functions', url: 'https://www.postgresql.org/docs/current/functions-info.html'}
  tidb:
    support: partial
    commands:
      - cmd: SHOW GLOBAL STATUS;
        note:
          zh: 只有很少几项，例如 Uptime 和 SSL 相关的；没有 Com_*、Threads_*、Bytes_* 这类计数
      - cmd: SELECT TYPE, INSTANCE, VERSION, START_TIME, UPTIME FROM information_schema.CLUSTER_INFO;
        note:
          zh: 集群里每个节点的版本和运行时长
    fields:
      uptime: Uptime
    notes:
      - zh: QPS、连接数、网络流量这些计数都在 Prometheus 里，看 Grafana 的 TiDB 面板；单台 tidb-server 也可以 curl http://<tidb>:10080/status 和 /metrics。
    refs:
      - {title: 'TiDB: SHOW STATUS', url: 'https://docs.pingcap.com/tidb/stable/sql-statement-show-status/'}
      - {title: 'TiDB: CLUSTER_INFO', url: 'https://docs.pingcap.com/tidb/stable/information-schema-cluster-info/'}
related: [list-active-sessions, show-variables]
