schema_version: 2
id: server-status
category: status
title: {zh: 查看服务器状态计数}
summary: {zh: 查看连接数、请求量、网络流量、缓存命中等累计计数，是做监控和看负载的起点。}
keywords:
  zh: [状态, 计数器, 连接数, QPS, 负载]
  en: [status, counters, serverstatus]
fields:
  - id: connections
    name: {zh: 当前连接数}
  - id: uptime
    name: {zh: 运行时长}
  - id: operations
    name: {zh: 各类操作计数}
  - id: network_bytes
    name: {zh: 网络收发字节}
  - id: cache
    name: {zh: 缓存指标}
databases:
  mysql:
    support: full
    commands:
      - cmd: SHOW GLOBAL STATUS;
      - cmd: SHOW GLOBAL STATUS LIKE 'Threads_%';
        note: {zh: 用 LIKE 过滤}
    fields:
      connections: Threads_connected
      uptime: Uptime
      operations: Com_select / Com_insert / …
      network_bytes: Bytes_received / Bytes_sent
      cache: Innodb_buffer_pool_*
    refs:
      - title: 'MySQL: SHOW STATUS'
        url: https://dev.mysql.com/doc/refman/8.4/en/show-status.html
  mongodb:
    support: partial
    commands:
      - cmd: db.serverStatus()
      - cmd: db.serverStatus().connections
        note: {zh: 用点路径取其中一部分}
    fields:
      connections: connections.current
      uptime: uptime
      operations: opcounters
      network_bytes: network.bytesIn / network.bytesOut
      cache:
        name: wiredTiger.cache
        note: {zh: 缓存相关指标}
    notes:
      - zh: 计数器从进程启动开始累计，算速率要取两次结果的差值，这一点和 MySQL 一样。
      - zh: 结果是嵌套文档而不是名值对，没有 LIKE 过滤，用点路径取子字段。
      - zh: 没有 FLUSH STATUS 这样重置计数器的命令。
    refs:
      - title: 'MongoDB: serverStatus'
        url: https://www.mongodb.com/docs/manual/reference/command/serverStatus/
related: [list-active-sessions, show-variables]
