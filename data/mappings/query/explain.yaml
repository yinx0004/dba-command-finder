schema_version: 2
id: explain
category: query
title: {zh: 查看执行计划}
summary: {zh: 看一条查询走没走索引、扫描了多少行，以及实际耗时。}
keywords:
  zh: [执行计划, 走索引, 全表扫描]
  en: [explain, explain analyze, query plan, executionstats]
fields:
  - id: full_scan
    name: {zh: 全表扫描}
  - id: index_used
    name: {zh: 使用的索引}
  - id: rows_examined
    name: {zh: 扫描行数}
  - id: elapsed
    name: {zh: 实际耗时}
databases:
  mysql:
    support: full
    commands:
      - cmd: EXPLAIN <select>;
        note: {zh: 只看计划，不执行}
      - cmd: EXPLAIN FORMAT=JSON <select>;
      - cmd: EXPLAIN ANALYZE <select>;
        since: 8.0.18
        note: {zh: 真正执行，给出实际行数和耗时}
    fields:
      full_scan: type = ALL
      index_used: key
      rows_examined: rows
      elapsed: actual time（EXPLAIN ANALYZE）
    refs:
      - title: 'MySQL: EXPLAIN'
        url: https://dev.mysql.com/doc/refman/8.4/en/explain.html
    verify:
      setup: CREATE TABLE t (id INT PRIMARY KEY, a INT, KEY idx_a (a)); INSERT INTO t VALUES (1, 1), (2, 2);
      vars: {select: SELECT * FROM t WHERE a = 1}
  mongodb:
    support: partial
    commands:
      - cmd: db.<collection>.find(<filter>).explain()
        note: {zh: 默认 queryPlanner 模式，只看计划}
      - cmd: db.<collection>.find(<filter>).explain("executionStats")
        note: {zh: 真正执行，给出实际扫描数和耗时}
      - cmd: db.<collection>.explain("executionStats").aggregate([<pipeline>])
        note: {zh: 聚合查询的写法}
    fields:
      full_scan:
        name: COLLSCAN 阶段
        note: {zh: 全表（全集合）扫描}
      index_used: IXSCAN 阶段的 indexName
      rows_examined:
        name: executionStats.totalDocsExamined
        note: {zh: MySQL 的 rows 是估算，这里是实际值}
      elapsed: executionStats.executionTimeMillis
    notes:
      - zh: explain("executionStats") 会真正执行查询，等同 EXPLAIN ANALYZE，在生产上注意耗时。
      - zh: 重点看 totalKeysExamined、totalDocsExamined、nReturned 三者的比例，扫描数远大于返回数就说明索引不合适。
    refs:
      - title: 'MongoDB: cursor.explain()'
        url: https://www.mongodb.com/docs/manual/reference/method/cursor.explain/
    verify:
      setup: 'db.t.insertMany([{ a: 1 }, { a: 2 }]); db.t.createIndex({ a: 1 })'
      vars: {collection: t, filter: '{ a: 1 }', pipeline: '{ $match: { a: 1 } }'}
  redis:
    support: partial
    commands:
      - cmd: 'FT.EXPLAIN <index> "@age:[20 40]"'
        since: '8.0'
        note:
          zh: 查询引擎会怎样执行这个查询，例如按数值范围查 age
    notes:
      - zh: 核心命令没有执行计划，每个命令的复杂度是固定的，写在命令文档里（例如 HGET 是 O(1)，SMEMBERS 是 O(N)）。只有查询引擎的查询才有执行计划。
      - zh: FT.* 是 Redis 8.0 自带的查询引擎；更早的版本要另外装 RediSearch 模块，lab 没有验证模块版本。
    refs:
      - {title: 'Redis: FT.EXPLAIN', url: 'https://redis.io/docs/latest/commands/ft.explain/'}
    verify:
      setup: |-
        HSET app:user:1 name alice age 30
        FT.CREATE idx:users ON HASH PREFIX 1 app:user: SCHEMA name TEXT age NUMERIC
      vars: {index: 'idx:users'}
      teardown: |-
        FT.DROPINDEX idx:users
        DEL app:user:1
  postgresql:
    support: full
    commands:
      - cmd: EXPLAIN SELECT * FROM <table> WHERE a = 1;
      - cmd: EXPLAIN (ANALYZE, BUFFERS) SELECT * FROM <table> WHERE a = 1;
        note:
          zh: 真正执行一遍，给出每一步实际的行数和耗时；对写语句要放在事务里再回滚
    fields:
      full_scan: {name: Seq Scan}
      index_used: {name: Index Scan / Bitmap Index Scan}
      rows_examined: rows
      elapsed: {name: actual time}
    refs:
      - {title: 'PostgreSQL: EXPLAIN', url: 'https://www.postgresql.org/docs/current/sql-explain.html'}
      - {title: 'PostgreSQL: Using EXPLAIN', url: 'https://www.postgresql.org/docs/current/using-explain.html'}
    verify:
      setup: |-
        CREATE TABLE t (id int PRIMARY KEY, a int);
        INSERT INTO t SELECT g, g % 10 FROM generate_series(1, 1000) g;
        CREATE INDEX idx_a ON t (a);
        ANALYZE t;
      vars: {table: t}
  tidb:
    support: full
    commands:
      - cmd: EXPLAIN <select>;
      - cmd: EXPLAIN ANALYZE <select>;
        note:
          zh: 真的执行一遍，actRows 是实际行数，execution info 里有每一步的耗时
      - cmd: EXPLAIN FORMAT = 'verbose' <select>;
        note:
          zh: 多出每一步的估算代价
    fields:
      full_scan: operator 为 TableFullScan
      index_used: access object
      rows_examined: estRows
      elapsed: execution info（EXPLAIN ANALYZE）
    notes:
      - zh: 输出和 MySQL 完全不同，是一棵算子树。task 列为 cop[tikv] 的步骤下推到 TiKV 上执行，root 在 tidb-server 上执行。不支持 FORMAT=JSON。
    refs:
      - {title: 'TiDB: EXPLAIN', url: 'https://docs.pingcap.com/tidb/stable/sql-statement-explain/'}
      - {title: 'TiDB: EXPLAIN ANALYZE', url: 'https://docs.pingcap.com/tidb/stable/sql-statement-explain-analyze/'}
    verify:
      setup: CREATE TABLE t (id INT PRIMARY KEY, a INT, KEY idx_a (a)); INSERT INTO t VALUES (1, 1), (2, 2);
      vars: {select: SELECT * FROM t WHERE a = 1}
related: [show-indexes, slow-query-log]
