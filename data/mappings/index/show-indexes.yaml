schema_version: 2
id: show-indexes
category: index
title: {zh: 查看表的索引}
summary: {zh: 列出一张表（集合）上的所有索引和索引字段。}
keywords:
  zh: [索引, 索引列表]
  en: [index, indexes, getindexes]
fields:
  - id: index_name
    name: {zh: 索引名}
  - id: key_columns
    name: {zh: 索引字段及顺序}
  - id: unique
    name: {zh: 是否唯一}
  - id: index_type
    name: {zh: 索引类型}
databases:
  mysql:
    support: full
    commands:
      - cmd: SHOW INDEX FROM <table>;
    fields:
      index_name: Key_name
      key_columns: Column_name / Seq_in_index
      unique: Non_unique
      index_type: Index_type
    refs:
      - title: 'MySQL: SHOW INDEX'
        url: https://dev.mysql.com/doc/refman/8.4/en/show-index.html
    verify:
      setup: CREATE TABLE t (id INT PRIMARY KEY, a INT, KEY idx_a (a));
      vars: {table: t}
  mongodb:
    support: partial
    commands:
      - cmd: db.<collection>.getIndexes()
    fields:
      index_name: name
      key_columns:
        name: key
        note: {zh: key 是一个文档，字段顺序就是索引列顺序}
      unique:
        name: unique
        note: {zh: 含义相反；没有 unique 字段即非唯一}
      index_type:
        name: key 的值
        note: {zh: 1 / -1 是升序 / 降序，另有 "text"、"2dsphere"、"hashed"}
    notes:
      - zh: MySQL 每个索引字段占一行；MongoDB 每个索引是一个文档，复合索引的字段都在 key 里。
      - zh: '查看索引的使用次数用 db.<collection>.aggregate([{ $indexStats: {} }])，对应 MySQL sys 库的 schema_index_statistics。'
    refs:
      - title: 'MongoDB: db.collection.getIndexes()'
        url: https://www.mongodb.com/docs/manual/reference/method/db.collection.getIndexes/
      - title: 'MongoDB: $indexStats'
        url: https://www.mongodb.com/docs/manual/reference/operator/aggregation/indexStats/
    verify:
      setup: 'db.t.createIndex({ a: 1 })'
      vars: {collection: t}
related: [list-tables, explain]
