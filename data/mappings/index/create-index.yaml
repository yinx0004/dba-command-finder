schema_version: 2
id: create-index
category: index
title: {zh: 创建索引}
summary: {zh: 给慢查询用到的列（字段）加索引。}
keywords:
  zh: [建索引, 加索引, 创建索引, 唯一索引]
  en: [create index, add index, createindex, unique index]
databases:
  mysql:
    support: full
    commands:
      - cmd: CREATE INDEX <index> ON <table> (<column>);
      - cmd: ALTER TABLE <table> ADD UNIQUE INDEX <index2> (<column2>), ALGORITHM=INPLACE, LOCK=NONE;
        note: {zh: 显式要求在线建索引；做不到时直接报错，而不是悄悄锁表}
    notes:
      - zh: InnoDB 建二级索引是在线 DDL，期间可以读写，只在开始和结束时短暂加锁。
    refs:
      - {title: 'MySQL: CREATE INDEX', url: 'https://dev.mysql.com/doc/refman/8.4/en/create-index.html'}
    verify:
      setup: CREATE TABLE t (id INT PRIMARY KEY, a INT, b INT);
      vars: {table: t, index: idx_a, column: a, index2: uk_b, column2: b}
  mongodb:
    support: full
    commands:
      - cmd: 'db.<collection>.createIndex({ <field>: 1 })'
        note: {zh: 1 升序，-1 降序}
      - cmd: 'db.<collection>.createIndex({ <field2>: 1 }, { unique: true, name: "<index2>" })'
        note: {zh: 唯一索引，并指定索引名}
    notes:
      - zh: 4.2 起建索引只在开始和结束时短暂加排他锁，其余时间不阻塞读写，以前的 background 选项已不再需要。
      - zh: 副本集上各成员会同时建索引（4.4 起），主节点等大多数成员建完才算完成。
    refs:
      - {title: 'MongoDB: db.collection.createIndex()', url: 'https://www.mongodb.com/docs/manual/reference/method/db.collection.createIndex/'}
      - {title: 'MongoDB: Index Builds on Populated Collections', url: 'https://www.mongodb.com/docs/manual/core/index-creation/'}
    verify:
      setup: 'db.t.insertMany([{ a: 1, b: 1 }, { a: 2, b: 2 }])'
      vars: {collection: t, field: a, field2: b, index2: uk_b}
  redis:
    support: partial
    commands:
      - cmd: 'FT.CREATE idx:users ON HASH PREFIX 1 app:user: SCHEMA name TEXT age NUMERIC'
        since: '8.0'
        note:
          zh: 给「app:user:」开头的哈希建索引，之后写入的键自动加进索引，已有的键在后台补建
      - cmd: ZADD app:user:by_age 30 app:user:1
        note:
          zh: 没有查询引擎时的常见做法：用有序集合自己维护一个按年龄排序的索引
    notes:
      - zh: 核心命令只能按键名取值，没有二级索引；要按字段查，用查询引擎，或者自己用集合、有序集合维护索引。
      - zh: FT.* 是 Redis 8.0 自带的查询引擎；更早的版本要另外装 RediSearch 模块，lab 没有验证模块版本。
    verify:
      setup: HSET app:user:1 name alice age 30
      teardown: |-
        FT.DROPINDEX idx:users
        DEL app:user:1 app:user:by_age
related: [show-indexes, drop-index, explain]
