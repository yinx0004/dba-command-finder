schema_version: 2
id: index-usage
category: index
title: {zh: 查看索引使用情况和无用索引}
summary: {zh: 找出从来没被用过的索引，删除前先确认。}
keywords:
  zh: [无用索引, 索引使用情况, 没用的索引, 索引命中]
  en: [unused indexes, schema_unused_indexes, schema_index_statistics, indexstats]
fields:
  - {id: index, name: {zh: 索引名}}
  - {id: usage, name: {zh: 使用次数}}
  - {id: since, name: {zh: 从什么时候开始统计}}
databases:
  mysql:
    support: full
    commands:
      - cmd: SELECT * FROM sys.schema_unused_indexes WHERE object_schema = '<db>';
        note: {zh: 自实例启动以来没被用过的索引}
      - cmd: SELECT * FROM sys.schema_index_statistics WHERE table_schema = '<db>';
        note: {zh: 每个索引被读写的行数和耗时}
    fields:
      index: index_name
      usage: rows_selected
    notes:
      - zh: 统计来自 performance_schema，实例重启后清零，要看足够长时间（例如覆盖月底跑批）再下结论。
    refs:
      - {title: 'MySQL: schema_unused_indexes', url: 'https://dev.mysql.com/doc/refman/8.4/en/sys-schema-unused-indexes.html'}
      - {title: 'MySQL: schema_index_statistics', url: 'https://dev.mysql.com/doc/refman/8.4/en/sys-schema-index-statistics.html'}
    verify:
      # Use one index so it has statistics; leave the other unused.
      setup: CREATE TABLE t (id INT PRIMARY KEY, a INT, b INT, KEY idx_a (a), KEY idx_b (b)); INSERT INTO t VALUES (1, 1, 1); SELECT * FROM t FORCE INDEX (idx_a) WHERE a = 1;
  mongodb:
    support: partial
    commands:
      - cmd: 'db.<collection>.aggregate([{ $indexStats: {} }])'
        note: {zh: 每个索引被用了多少次（accesses.ops）、从什么时候开始统计}
    fields:
      index: name
      usage: accesses.ops
      since: accesses.since
    notes:
      - zh: 只统计当前这个节点，副本集要在每个成员上分别看；mongod 重启后清零。
      - zh: 没有现成的「无用索引」视图，用 accesses.ops 为 0 来判断。
    refs:
      - {title: 'MongoDB: $indexStats', url: 'https://www.mongodb.com/docs/manual/reference/operator/aggregation/indexStats/'}
    verify:
      setup: 'db.t.insertOne({ a: 1, b: 1 }); db.t.createIndex({ a: 1 }); db.t.createIndex({ b: 1 }); db.t.find({ a: 1 }).toArray()'
      vars: {collection: t}
  redis:
    support: none
    notes:
      - zh: 没有按索引统计使用次数的命令。
  postgresql:
    support: full
    commands:
      - cmd: SELECT relname, indexrelname, idx_scan FROM pg_stat_user_indexes ORDER BY idx_scan;
        note:
          zh: idx_scan 为 0 的是从统计重置以来没用过的索引
      - cmd: SELECT indexrelname, idx_scan, last_idx_scan FROM pg_stat_user_indexes ORDER BY last_idx_scan NULLS FIRST;
        since: '16'
        note:
          zh: 最后一次被用到的时间
    fields:
      index: indexrelname
      usage: idx_scan
      since: {name: last_idx_scan, since: '16'}
    notes:
      - zh: 统计只在本机，备库上的使用不算进主库；判断没用之前，主备都要看。
    refs:
      - {title: 'PostgreSQL: pg_stat_all_indexes', url: 'https://www.postgresql.org/docs/current/monitoring-stats.html#MONITORING-PG-STAT-ALL-INDEXES-VIEW'}
    verify:
      setup: |-
        CREATE TABLE t (id int PRIMARY KEY, a int);
        INSERT INTO t SELECT g, g % 10 FROM generate_series(1, 1000) g;
  tidb:
    support: full
    commands:
      - cmd: SELECT * FROM sys.schema_unused_indexes WHERE object_schema = '<db>';
        since: '8.0'
        note:
          zh: tidb-server 启动以来没用过的索引
      - cmd: SELECT TABLE_NAME, INDEX_NAME, QUERY_TOTAL, ROWS_ACCESS_TOTAL, LAST_ACCESS_TIME FROM information_schema.TIDB_INDEX_USAGE WHERE TABLE_SCHEMA = '<db>';
        since: '8.0'
        note:
          zh: 每个索引被查询用了多少次、读了多少行；看整个集群用 CLUSTER_TIDB_INDEX_USAGE
    fields:
      index: index_name
      usage: QUERY_TOTAL
    notes:
      - zh: 统计只在内存里，tidb-server 重启后从零开始；多台 tidb-server 时，一个索引在某台上没用过不代表没人用。
    refs:
      - {title: 'TiDB: TIDB_INDEX_USAGE', url: 'https://docs.pingcap.com/tidb/stable/information-schema-tidb-index-usage/'}
      - {title: 'TiDB: schema_unused_indexes', url: 'https://docs.pingcap.com/tidb/stable/sys-schema-unused-indexes/'}
    verify:
      setup: CREATE TABLE t (id INT PRIMARY KEY, a INT, b INT, KEY idx_a (a), KEY idx_b (b)); INSERT INTO t VALUES (1, 1, 1); SELECT * FROM t FORCE INDEX (idx_a) WHERE a = 1;
related: [show-indexes, drop-index, invisible-index]
