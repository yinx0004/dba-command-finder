schema_version: 2
id: redundant-indexes
category: index
title: {zh: 找出冗余索引}
summary: {zh: 一个索引是另一个索引的前缀时，前者通常是多余的，白白拖慢写入、占用空间。}
keywords:
  zh: [冗余索引, 重复索引, 多余的索引]
  en: [redundant index, duplicate index, schema_redundant_indexes]
fields:
  - {id: redundant, name: {zh: 多余的索引}}
  - {id: dominant, name: {zh: 覆盖它的索引}}
databases:
  mysql:
    support: full
    commands:
      - cmd: SELECT * FROM sys.schema_redundant_indexes WHERE table_schema = '<db>';
        note: {zh: sql_drop_index 列直接给出删除语句}
    fields:
      redundant: redundant_index_name
      dominant: dominant_index_name
    refs:
      - {title: 'MySQL: sys.schema_redundant_indexes', url: 'https://dev.mysql.com/doc/refman/8.4/en/sys-schema-redundant-indexes.html'}
    verify:
      setup: CREATE TABLE t (id INT PRIMARY KEY, a INT, b INT, KEY idx_a (a), KEY idx_ab (a, b));
  mongodb:
    support: none
    notes:
      - zh: '没有现成的冗余索引检查。规则和 MySQL 一样：复合索引 { a: 1, b: 1 } 能覆盖只按 a 的查询，单独的 { a: 1 } 通常多余；但带 unique、partialFilterExpression、collation 等选项的索引要单独看，不能简单按前缀删。'
    alternatives:
      - title: {zh: 列出索引，对比键的前缀}
        see: show-indexes
      - title: {zh: 删除前先看它有没有被用过}
        see: index-usage
      - title: {zh: 删除前先隐藏观察}
        see: invisible-index
  redis:
    support: none
    notes:
      - zh: 没有能自动比较的索引定义，找不出冗余索引。
  postgresql:
    support: partial
    commands:
      - cmd: SELECT a.indexrelid::regclass AS redundant, b.indexrelid::regclass AS dominant FROM pg_index a JOIN pg_index b ON a.indrelid = b.indrelid AND a.indexrelid <> b.indexrelid AND b.indkey::text LIKE a.indkey::text || ' %';
        note:
          zh: 找出列是另一个索引前缀的索引，例如 (a) 和 (a, id)
    fields:
      redundant: redundant
      dominant: dominant
    notes:
      - zh: 没有现成的视图，要自己比较；唯一索引和用作约束的索引，即使是前缀也可能要保留。
    refs:
      - {title: 'PostgreSQL: pg_index', url: 'https://www.postgresql.org/docs/current/catalog-pg-index.html'}
    verify:
      setup: |-
        CREATE TABLE t (id int PRIMARY KEY, a int);
        CREATE INDEX idx_a ON t (a);
        CREATE INDEX idx_a_id ON t (a, id);
  tidb:
    support: partial
    commands:
      - cmd: SELECT TABLE_NAME, KEY_NAME, SEQ_IN_INDEX, COLUMN_NAME FROM information_schema.TIDB_INDEXES WHERE TABLE_SCHEMA = '<db>' ORDER BY TABLE_NAME, KEY_NAME, SEQ_IN_INDEX;
        note:
          zh: 列出每个索引的列和顺序，一个索引的列是另一个索引的前缀时，前者通常是冗余的
    notes:
      - zh: 没有 sys.schema_redundant_indexes，要自己对比。
    refs:
      - {title: 'TiDB: TIDB_INDEXES', url: 'https://docs.pingcap.com/tidb/stable/information-schema-tidb-indexes/'}
    verify:
      setup: CREATE TABLE t (id INT PRIMARY KEY, a INT, b INT, KEY idx_a (a), KEY idx_ab (a, b));
related: [index-usage, drop-index]
