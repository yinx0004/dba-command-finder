schema_version: 2
id: restrict-user-host
category: user
title: {zh: 限制账号的登录来源}
summary: {zh: 只允许应用服务器所在的网段用这个账号登录，其他地方拿到密码也连不上。}
keywords:
  zh: [限制登录 IP, 登录来源, 白名单, 只允许某个网段, 来源主机]
  en: [user host, rename user, authenticationrestrictions, clientsource]
fields:
  - {id: source, name: {zh: 允许的来源}}
databases:
  mysql:
    support: full
    commands:
      - cmd: CREATE USER '<user>'@'<host>' IDENTIFIED BY '<password>';
        note: {zh: "例如 '10.0.%' 只允许 10.0 开头的地址"}
      - cmd: RENAME USER '<user>'@'<host>' TO '<user>'@'<new_host>';
        note: {zh: 改已有账号的来源，权限跟着一起走}
      - cmd: SELECT user, host FROM mysql.user WHERE user = '<user>';
    fields:
      source: host
    notes:
      - zh: user@host 整体才是一个账号，同名不同 host 是两个账号，各自有密码和权限；登录时匹配最具体的那个 host。
      - zh: "8.0.23 起 host 可以写成 CIDR，例如 '10.0.0.0/8'；更早的版本用子网掩码写法 '10.0.0.0/255.0.0.0'。"
    refs:
      - {title: 'MySQL: Specifying Account Names', url: 'https://dev.mysql.com/doc/refman/8.4/en/account-names.html'}
      - {title: 'MySQL: RENAME USER', url: 'https://dev.mysql.com/doc/refman/8.4/en/rename-user.html'}
    verify:
      vars: {user: app_host, host: '10.0.%', new_host: '192.168.1.%', password: 'Lab#Pass123'}
  mongodb:
    support: full
    commands:
      - cmd: 'db.createUser({ user: "<user>", pwd: "<password>", roles: [], authenticationRestrictions: [{ clientSource: ["10.0.0.0/8"] }] })'
      - cmd: 'db.updateUser("<user>", { authenticationRestrictions: [{ clientSource: ["10.0.0.0/8", "192.168.1.0/24"] }] })'
        note: {zh: 改已有用户的来源限制，会整体替换原来的设置}
      - cmd: 'db.getUser("<user>", { showAuthenticationRestrictions: true })'
    fields:
      source: clientSource
    notes:
      - zh: 一个用户只有一套密码和角色，来源限制是加在它身上的条件，不像 MySQL 那样按 host 拆成多个账号。
      - zh: 还可以用 serverAddress 限制客户端连的是哪个服务端地址。限制只在开启认证（security.authorization）后才起作用。
    refs:
      - {title: 'MongoDB: db.createUser() authenticationRestrictions', url: 'https://www.mongodb.com/docs/manual/reference/method/db.createUser/#authentication-restrictions'}
    verify:
      vars: {user: app_host, password: 'Lab#Pass123'}
related: [create-user, account-lock, list-users]
