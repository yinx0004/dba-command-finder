schema_version: 2
id: change-password
category: user
title: {zh: 修改用户密码}
summary: {zh: 给账号改密码，例如定期轮换或密码泄露后。}
keywords:
  zh: [改密码, 修改密码, 重置密码]
  en: [alter user, set password, changeuserpassword]
databases:
  mysql:
    support: full
    commands:
      - cmd: ALTER USER '<user>'@'<host>' IDENTIFIED BY '<password>';
      - cmd: SET PASSWORD FOR '<user>'@'<host>' = '<password>';
    refs:
      - {title: 'MySQL: ALTER USER', url: 'https://dev.mysql.com/doc/refman/8.4/en/alter-user.html'}
    verify:
      setup: CREATE USER 'app_pass'@'%' IDENTIFIED BY 'Lab#Pass123';
      vars: {user: app_pass, host: '%', password: 'Lab#Pass456'}
  mongodb:
    support: full
    commands:
      - cmd: 'db.changeUserPassword("<user>", "<password>")'
        note: {zh: 在用户所属的认证库里执行；交互使用时可以把密码写成 passwordPrompt()}
    refs:
      - {title: 'MongoDB: db.changeUserPassword()', url: 'https://www.mongodb.com/docs/manual/reference/method/db.changeUserPassword/'}
    verify:
      setup: 'db.createUser({ user: "app_pass", pwd: "Lab#Pass123", roles: [] })'
      vars: {user: app_pass, password: 'Lab#Pass456'}
  redis:
    support: full
    commands:
      - cmd: ACL SETUSER <user> resetpass ><password>
        note:
          zh: resetpass 先清掉所有旧密码，再设新密码
      - cmd: ACL SETUSER <user> ><password>
        note:
          zh: 只加一个新密码，旧密码仍然能用，适合先换客户端配置再删旧密码
    notes:
      - zh: 一个用户可以同时有多个密码；用 <旧密码（小于号开头）删掉指定的那个。
      - zh: 默认用户 default 的密码也可以用 requirepass 参数设置。
    verify:
      setup: 'ACL SETUSER app_pw on >Lab#Pass123 ~* +@all'
      vars: {user: app_pw, password: 'Lab#New456'}
      teardown: ACL DELUSER app_pw
related: [create-user]
