schema_version: 2
id: password-policy
category: user
title: {zh: 设置密码策略}
summary: {zh: 要求密码够复杂、定期更换，或者连续输错几次就锁定账号，常见于安全审计和等保要求。}
keywords:
  zh: [密码策略, 密码复杂度, 密码过期, 登录失败锁定, 弱密码, 等保]
  en: [validate_password, password expire, failed_login_attempts, password policy, ACL GENPASS]
databases:
  mysql:
    support: full
    commands:
      - cmd: SHOW VARIABLES LIKE 'validate_password%';
        note: {zh: 没有结果说明还没启用密码复杂度检查}
      - cmd: INSTALL PLUGIN validate_password SONAME 'validate_password.so';
        deprecated_in: '8.0'
        note: {zh: 5.7 用插件，变量名形如 validate_password_policy}
      - cmd: INSTALL COMPONENT 'file://component_validate_password';
        since: '8.0'
        note: {zh: 8.0 起改用组件，变量名形如 validate_password.policy；默认策略 MEDIUM：至少 8 位，含大小写字母、数字和特殊字符}
      - cmd: ALTER USER '<user>'@'<host>' PASSWORD EXPIRE INTERVAL 90 DAY;
        note: {zh: 这个账号的密码 90 天过期；全局默认值由 default_password_lifetime 控制，默认 0 表示永不过期}
      - cmd: ALTER USER '<user>'@'<host>' FAILED_LOGIN_ATTEMPTS 5 PASSWORD_LOCK_TIME 1;
        since: 8.0.19
        note: {zh: 连续输错 5 次锁定 1 天}
    notes:
      - zh: 复杂度检查只在设置密码时生效，已有的弱密码不会被发现，要逐个改。
    refs:
      - {title: 'MySQL: The Password Validation Component', url: 'https://dev.mysql.com/doc/refman/8.4/en/validate-password.html'}
      - {title: 'MySQL: Password Management', url: 'https://dev.mysql.com/doc/refman/8.4/en/password-management.html'}
    verify:
      setup: CREATE USER 'app_pw'@'%' IDENTIFIED BY 'Lab#Pass123';
      vars: {user: app_pw, host: '%'}
      # Plugin first, so 5.7 (where UNINSTALL COMPONENT is a syntax error) still drops it.
      teardown: UNINSTALL PLUGIN validate_password; UNINSTALL COMPONENT 'file://component_validate_password';
  mongodb:
    support: none
    notes:
      - zh: 社区版没有密码复杂度、密码过期和登录失败锁定，需要在创建用户的流程里自己把关。
      - zh: 企业版可以通过 LDAP 或 Kerberos 认证，把密码策略交给目录服务管理。
    alternatives:
      - title: {zh: 交互输入密码，不留在命令历史里}
        cmd: 'db.createUser({ user: "<user>", pwd: passwordPrompt(), roles: [] })'
    refs:
      - {title: 'MongoDB: Authentication Mechanisms', url: 'https://www.mongodb.com/docs/manual/core/authentication/'}
  redis:
    support: none
    notes:
      - zh: 没有密码复杂度、过期和登录失败锁定这类策略，密码规则只能在建用户的流程里自己把关。
    alternatives:
      - title: {zh: 生成一个随机的强密码}
        cmd: ACL GENPASS
related: [create-user, change-password, account-lock]
