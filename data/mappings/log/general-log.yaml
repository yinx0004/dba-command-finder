schema_version: 2
id: general-log
category: log
title: {zh: 记录所有执行的语句}
summary: {zh: 临时把每一条语句都记下来，排查应用到底发了什么请求。}
keywords:
  zh: [通用日志, 记录所有语句, 全量日志, 审计]
  en: [general_log, general log, profiler level 2, profile all]
fields:
  - {id: time, name: {zh: 时间}}
  - {id: client, name: {zh: 客户端}}
  - {id: statement, name: {zh: 语句}}
databases:
  mysql:
    support: full
    commands:
      - cmd: SET GLOBAL log_output = 'TABLE';
        note: {zh: 写到表里，方便用 SQL 查；默认 FILE 写到文件}
      - cmd: SET GLOBAL general_log = ON;
      - cmd: SELECT * FROM mysql.general_log ORDER BY event_time DESC LIMIT 20;
    fields:
      time: event_time
      client: user_host
      statement: argument
    notes:
      - zh: 开销很大，只在排查时短时间打开，用完 SET GLOBAL general_log = OFF。
    refs:
      - {title: 'MySQL: The General Query Log', url: 'https://dev.mysql.com/doc/refman/8.4/en/query-log.html'}
    verify:
      teardown: SET GLOBAL general_log = OFF; SET GLOBAL log_output = 'FILE';
  mongodb:
    support: partial
    commands:
      - cmd: db.setProfilingLevel(2)
        note: {zh: 当前库的所有操作都写进 system.profile}
      - cmd: 'db.system.profile.find().sort({ ts: -1 }).limit(20)'
    fields:
      time: ts
      client: client
      statement: command
    notes:
      - zh: 按库开启，只记录当前库的操作；结果存在固定大小的 system.profile 集合里（默认 1 MB），旧记录会被覆盖。
      - zh: 开销同样很大，用完 db.setProfilingLevel(0)。
    refs:
      - {title: 'MongoDB: Database Profiler', url: 'https://www.mongodb.com/docs/manual/tutorial/manage-the-database-profiler/'}
    verify:
      # Operations on system.profile itself are not profiled, so profile one query before looking.
      setup: 'db.t.insertOne({ a: 1 }); db.setProfilingLevel(2); db.t.find({ a: 1 }).toArray()'
      teardown: db.setProfilingLevel(0)
  redis:
    support: partial
    commands:
      - cmd: MONITOR
        skip: {zh: MONITOR 会一直输出，不会自己结束}
        note:
          zh: 实时打印实例收到的每条命令，带时间戳、库号和客户端地址
    fields:
      time: {name: MONITOR 每行开头的时间戳}
      client: {name: MONITOR 每行方括号里的客户端地址}
      statement: {name: MONITOR 每行后面的命令和参数}
    notes:
      - zh: MONITOR 只在连接期间输出，不落盘，而且会明显拖慢实例，只适合短时间排查；没有能一直开着的语句日志。
    refs:
      - {title: 'Redis: MONITOR', url: 'https://redis.io/docs/latest/commands/monitor/'}
  postgresql:
    support: full
    commands:
      - cmd: ALTER SYSTEM SET log_statement = 'all';
        note:
          zh: none、ddl、mod、all 四档
      - cmd: SELECT pg_reload_conf();
    fields:
      time: {name: log_line_prefix 里的 %m}
      client: {name: log_line_prefix 里的 %h}
      statement: {name: 日志里 statement 后面的语句}
    notes:
      - zh: 记录所有语句会产生大量日志；排查慢语句更常用 log_min_duration_statement。
    refs:
      - {title: 'PostgreSQL: log_statement', url: 'https://www.postgresql.org/docs/current/runtime-config-logging.html#GUC-LOG-STATEMENT'}
    verify:
      teardown: |-
        ALTER SYSTEM RESET log_statement;
        SELECT pg_reload_conf();
  tidb:
    support: partial
    commands:
      - cmd: SET GLOBAL tidb_general_log = ON;
        note:
          zh: 实例级变量，只对当前这台 tidb-server 生效；语句写进 tidb-server 的日志文件，不能写到表里
      - cmd: SELECT TIME, INSTANCE, MESSAGE FROM information_schema.CLUSTER_LOG WHERE time BETWEEN '<start_time>' AND '<end_time>' AND message LIKE '%GENERAL_LOG%' LIMIT 20;
    notes:
      - zh: 每条语句都记一次，开销很大，只在排查时短时间打开。
    refs:
      - {title: 'TiDB: tidb_general_log', url: 'https://docs.pingcap.com/tidb/stable/system-variables/#tidb_general_log'}
    verify:
      vars: {start_time: '2026-01-01 00:00:00', end_time: '2026-01-01 01:00:00'}
      teardown: SET GLOBAL tidb_general_log = OFF;
related: [slow-query-log, error-log]
