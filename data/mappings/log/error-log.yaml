schema_version: 2
id: error-log
category: log
title: {zh: 查看错误日志}
summary: {zh: 找到错误日志在哪，或者直接查最近的日志，排查启动失败、崩溃、连接报错。}
keywords:
  zh: [错误日志, 日志在哪, 最近的日志]
  en: [error log, log_error, getlog, show log]
fields:
  - {id: time, name: {zh: 时间}}
  - {id: message, name: {zh: 日志内容}}
databases:
  mysql:
    support: full
    commands:
      - cmd: SHOW VARIABLES LIKE 'log_error';
        note: {zh: 错误日志文件的路径；stderr 表示输出到标准错误（容器里常见）}
      - cmd: SELECT * FROM performance_schema.error_log ORDER BY LOGGED DESC LIMIT 20;
        since: 8.0.22
        note: {zh: 不用登录服务器，直接用 SQL 查最近的错误日志}
    fields:
      time: LOGGED
      message: DATA
    refs:
      - {title: 'MySQL: The Error Log', url: 'https://dev.mysql.com/doc/refman/8.4/en/error-log.html'}
      - {title: 'MySQL: The error_log Table', url: 'https://dev.mysql.com/doc/refman/8.4/en/performance-schema-error-log-table.html'}
  mongodb:
    support: full
    commands:
      - cmd: 'db.adminCommand({ getCmdLineOpts: 1 }).parsed.systemLog'
        note: {zh: 日志文件的路径；没配置时日志输出到标准输出}
      - cmd: 'db.adminCommand({ getLog: "global" })'
        note: {zh: 直接查内存里最近的 1024 条日志}
    fields:
      time: t.$date
      message: msg
    notes:
      - zh: 4.4 起日志是 JSON 格式，每条一行，可以直接用 jq 过滤。
    refs:
      - {title: 'MongoDB: getLog', url: 'https://www.mongodb.com/docs/manual/reference/command/getLog/'}
      - {title: 'MongoDB: Log Messages', url: 'https://www.mongodb.com/docs/manual/reference/log-messages/'}
  redis:
    support: partial
    commands:
      - cmd: CONFIG GET logfile
        note:
          zh: 日志文件路径；为空表示写到标准输出，在容器里用 docker logs 看
      - cmd: CONFIG GET loglevel
    notes:
      - zh: 没有用命令读日志内容的办法，直接看日志文件。日志不分错误日志和普通日志，用 loglevel 控制详细程度。
    refs:
      - {title: 'Redis: CONFIG GET', url: 'https://redis.io/docs/latest/commands/config-get/'}
  postgresql:
    support: partial
    commands:
      - cmd: SHOW log_destination;
      - cmd: SHOW logging_collector;
        note:
          zh: on 时写到 log_directory 下的文件；off 时写到标准错误，在容器里用 docker logs 看
      - cmd: SELECT pg_current_logfile();
        note:
          zh: 当前日志文件的路径；没开 logging_collector 时为空
    notes:
      - zh: 日志不分错误日志和普通日志，用 log_min_messages 控制详细程度；超级用户可以用 pg_read_file(pg_current_logfile()) 在 SQL 里读日志。
    refs:
      - {title: 'PostgreSQL: Where to Log', url: 'https://www.postgresql.org/docs/current/runtime-config-logging.html#RUNTIME-CONFIG-LOGGING-WHERE'}
  tidb:
    support: full
    commands:
      - cmd: SHOW CONFIG WHERE type = 'tidb' AND name = 'log.file.filename';
        note:
          zh: tidb-server 的日志文件；TiKV、PD 把 type 换成 tikv、pd
      - cmd: SELECT TIME, TYPE, INSTANCE, LEVEL, MESSAGE FROM information_schema.CLUSTER_LOG WHERE time BETWEEN '<start_time>' AND '<end_time>' AND level IN ('warn', 'error') LIMIT 20;
        note:
          zh: 用 SQL 搜索集群里所有节点的日志，必须写开始和结束时间
    fields:
      time: TIME
      message: MESSAGE
    notes:
      - zh: 没有 MySQL 那种单独的错误日志，错误和其他日志写在同一个文件里，按 LEVEL 区分。
    refs:
      - {title: 'TiDB: CLUSTER_LOG', url: 'https://docs.pingcap.com/tidb/stable/information-schema-cluster-log/'}
      - {title: 'TiDB: log.file.filename', url: 'https://docs.pingcap.com/tidb/stable/tidb-configuration-file/#filename'}
    verify:
      vars: {start_time: '2026-01-01 00:00:00', end_time: '2026-01-01 01:00:00'}
      skip_fields: {zh: lab 的 tidb-server 把日志写到标准输出，没有日志文件可搜}
related: [rotate-logs, slow-query-log]
