schema_version: 2
id: replication-position
category: replication
title: {zh: 查看复制位点}
summary: {zh: 记下或对比主从各自执行到哪了，做切换、搭从库、按位点恢复时都要用。}
keywords:
  zh: [复制位点, 同步位置, GTID, binlog 位置]
  en: [gtid_executed, executed_gtid_set, binlog position, optime, pg_current_wal_lsn]
fields:
  - {id: position, name: {zh: 位点}}
databases:
  mysql:
    support: full
    commands:
      - cmd: SELECT @@gtid_mode, @@gtid_executed;
        note: {zh: 开了 GTID 时，gtid_executed 就是执行到哪的完整记录}
      - cmd: SHOW MASTER STATUS;
        deprecated_in: 8.2.0
        removed_in: '8.4'
        note: {zh: 当前 binlog 文件名和偏移}
      - cmd: SHOW BINARY LOG STATUS;
        since: 8.2.0
    fields:
      position: {name: Executed_Gtid_Set, note: {zh: 不开 GTID 时用 File + Position 表示位点}}
    refs:
      - {title: 'MySQL: GTID Concepts', url: 'https://dev.mysql.com/doc/refman/8.4/en/replication-gtids-concepts.html'}
  mongodb:
    support: partial
    commands:
      - cmd: 'rs.status().members.map(m => ({ name: m.name, state: m.stateStr, optimeDate: m.optimeDate }))'
        note: {zh: 每个成员执行到的 oplog 时间点}
    fields:
      position: optimeDate
    notes:
      - zh: 位点就是 oplog 里的时间戳（optime），没有「文件名 + 偏移」这种形式，也不需要手动记录：从节点会自己找到同步起点。
    refs:
      - {title: 'MongoDB: rs.status()', url: 'https://www.mongodb.com/docs/manual/reference/method/rs.status/'}
  redis:
    support: full
    commands:
      - cmd: INFO replication
        note:
          zh: master_replid 是复制流的 ID，master_repl_offset 是写到哪个位置了；从库上还有 slave_repl_offset
      - cmd: ROLE
        note:
          zh: 主库返回自己的位置和每个从库确认到的位置
    fields:
      position: master_repl_offset
    notes:
      - zh: 位置是复制流里的字节偏移，主从对比 master_repl_offset 和 slave_repl_offset 就知道从库落后多少字节。
    refs:
      - {title: 'Redis: ROLE', url: 'https://redis.io/docs/latest/commands/role/'}
      - {title: 'Redis: Replication', url: 'https://redis.io/docs/latest/operate/oss_and_stack/management/replication/'}
  postgresql:
    support: full
    commands:
      - cmd: SELECT pg_current_wal_lsn();
        note:
          zh: 主库写到 WAL 的哪个位置
      - cmd: SELECT pg_last_wal_receive_lsn(), pg_last_wal_replay_lsn();
        on: [standby]
        note:
          zh: 备库收到和回放到哪个位置
    fields:
      position: pg_current_wal_lsn
    refs:
      - {title: 'PostgreSQL: Backup Control Functions', url: 'https://www.postgresql.org/docs/current/functions-admin.html#FUNCTIONS-ADMIN-BACKUP'}
      - {title: 'PostgreSQL: Recovery Control Functions', url: 'https://www.postgresql.org/docs/current/functions-admin.html#FUNCTIONS-RECOVERY-CONTROL'}
  tidb:
    support: partial
    commands:
      - cmd: SHOW MASTER STATUS;
        note:
          zh: Position 是当前的 TSO（时间戳），不是 binlog 位点；File 固定为 tidb-binlog
      - cmd: SHOW BINARY LOG STATUS;
        since: '8.0'
      - cmd: SELECT TIDB_PARSE_TSO(<tso>);
        note:
          zh: 把 TSO 换算成时间
    fields:
      position: Position
    notes:
      - zh: 没有 GTID。TiCDC 同步任务的进度看它的 checkpoint-ts，用 cdc cli changefeed query 查。
    refs:
      - {title: 'TiDB: SHOW MASTER STATUS', url: 'https://docs.pingcap.com/tidb/stable/sql-statement-show-master-status/'}
      - {title: 'TiDB: TIDB_PARSE_TSO', url: 'https://docs.pingcap.com/tidb/stable/tidb-functions/'}
    verify:
      vars: {tso: '470474558623449088'}
related: [replication-status, binlog-retention, point-in-time-recovery]
