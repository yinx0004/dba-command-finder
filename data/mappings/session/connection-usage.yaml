schema_version: 2
id: connection-usage
category: session
title: {zh: 查看连接数用了多少、上限多少、从哪来}
summary: {zh: 报「连接数满了」时，看现在有多少、峰值多少、上限多少，以及是哪些客户端占着。}
keywords:
  zh: [连接数, 连接数满了, 最大连接数, 连接来源, too many connections, 连接池]
  en: [max_connections, threads_connected, max_used_connections, connections, client, maxincomingconnections, connpoolstats]
fields:
  - {id: current, name: {zh: 当前连接数}}
  - {id: peak, name: {zh: 历史峰值}}
  - {id: limit, name: {zh: 上限}}
  - {id: client, name: {zh: 客户端}}
databases:
  mysql:
    support: full
    commands:
      - cmd: SHOW GLOBAL STATUS WHERE Variable_name IN ('Threads_connected', 'Max_used_connections', 'Max_used_connections_time', 'Aborted_connects');
      - cmd: SELECT @@max_connections;
      - cmd: SELECT SUBSTRING_INDEX(HOST, ':', 1) AS client, USER, COUNT(*) AS connections FROM information_schema.PROCESSLIST GROUP BY client, USER ORDER BY connections DESC;
        note: {zh: 按来源主机和用户汇总}
    fields:
      current: Threads_connected
      peak: Max_used_connections
      limit: max_connections
      client: client
    refs:
      - {title: 'MySQL: max_connections', url: 'https://dev.mysql.com/doc/refman/8.4/en/server-system-variables.html#sysvar_max_connections'}
  mongodb:
    support: partial
    commands:
      - cmd: db.serverStatus().connections
        on: [mongod, mongos, configsvr]
        note: {zh: 连到这个进程的连接；current 是当前连接数，available 是还能再建多少}
      - cmd: 'db.adminCommand({ getCmdLineOpts: 1 }).parsed.net'
        on: [mongod, mongos, configsvr]
        note: {zh: 启动时配置的上限 maxIncomingConnections；没配置时不显示，默认 1000000}
      - cmd: 'db.getSiblingDB("admin").aggregate([{ $currentOp: { allUsers: true, idleConnections: true, localOps: true } }, { $group: { _id: { $arrayElemAt: [{ $split: ["$client", ":"] }, 0] }, connections: { $sum: 1 } } }, { $sort: { connections: -1 } }])'
        on: [mongod, mongos, configsvr]
        note: {zh: '按来源主机汇总；在 mongos 上必须加 localOps: true，否则看到的是各分片上的操作；_id 为 null 的是内部线程'}
      - cmd: 'db.adminCommand({ connPoolStats: 1 })'
        on: [mongos, mongod]
        note: {zh: 这个进程主动连出去的连接池，例如 mongos 连各分片和 config server 的连接；hosts 下按目标列出}
    fields:
      current: current
      limit: {name: available, note: {zh: 剩余可用的连接数；上限 = current + available}}
      client: {name: _id, note: {zh: 来源主机}}
    notes:
      - zh: 分片集群里每个进程各算各的。应用连的是 mongos，「连接数满了」通常要在每个 mongos 上查；分片成员和 config server 上的连接主要来自 mongos 和副本集的其他成员。
      - zh: 上限由 net.maxIncomingConnections 和操作系统的文件句柄限制（ulimit -n）共同决定，取较小的那个，所以实际上限看 current + available 更准。
      - zh: 没有历史峰值；totalCreated 是自启动以来一共建过多少连接，持续猛涨通常说明客户端没用好连接池。
    refs:
      - {title: 'MongoDB: serverStatus connections', url: 'https://www.mongodb.com/docs/manual/reference/command/serverStatus/#connections'}
      - {title: 'MongoDB: net.maxIncomingConnections', url: 'https://www.mongodb.com/docs/manual/reference/configuration-options/#mongodb-setting-net.maxIncomingConnections'}
      - {title: 'MongoDB: connPoolStats', url: 'https://www.mongodb.com/docs/manual/reference/command/connPoolStats/'}
  redis:
    support: partial
    commands:
      - cmd: INFO clients
        note:
          zh: connected_clients 是当前连接数，blocked_clients 是停在 BLPOP 这类阻塞命令上的连接数
      - cmd: CONFIG GET maxclients
      - cmd: CLIENT LIST
        note:
          zh: addr 是每个连接的来源地址和端口
    fields:
      current: connected_clients
      limit: maxclients
      client: addr
    notes:
      - zh: 没有历史最高连接数，要看峰值得靠监控系统定期采样 connected_clients。
related: [list-active-sessions, kill-session, server-status]
