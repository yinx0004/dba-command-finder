schema_version: 2
id: batch-delete
category: data
title: {zh: 分批删除大量数据}
summary: {zh: 一次删几千万行会长时间锁表、撑爆 undo、让从库延迟，要拆成小批一点点删。}
keywords:
  zh: [分批删除, 大量删除, 删除数据, 批量删除]
  en: [delete limit, deletemany, batch delete, chunked delete]
databases:
  mysql:
    support: full
    commands:
      - cmd: DELETE FROM <table> WHERE created_at < NOW() - INTERVAL 30 DAY LIMIT 1000;
        note: {zh: 反复执行，直到影响行数为 0；每批之间可以稍微停一下，给从库喘息}
    notes:
      - zh: 按主键范围分批（WHERE id BETWEEN … AND …）比 LIMIT 更稳定，不会每批都重新扫描一遍已删过的区域。
    refs:
      - {title: 'MySQL: DELETE', url: 'https://dev.mysql.com/doc/refman/8.4/en/delete.html'}
    verify:
      setup: CREATE TABLE t (id INT PRIMARY KEY, created_at DATETIME); INSERT INTO t VALUES (1, NOW() - INTERVAL 40 DAY), (2, NOW());
      vars: {table: t}
  mongodb:
    support: partial
    commands:
      - cmd: 'const ids = db.<collection>.find({ createdAt: { $lt: new Date(Date.now() - 30 * 86400000) } }, { _id: 1 }).limit(1000).toArray().map(d => d._id); db.<collection>.deleteMany({ _id: { $in: ids } })'
        note: {zh: 先取一批 _id 再删，反复执行直到 deletedCount 为 0}
    notes:
      - zh: deleteMany 没有 LIMIT，一条命令会把符合条件的全部删掉，所以要自己先取一批 _id。只是要定期清理旧数据的话，TTL 索引更省事。
    refs:
      - {title: 'MongoDB: db.collection.deleteMany()', url: 'https://www.mongodb.com/docs/manual/reference/method/db.collection.deleteMany/'}
    verify:
      setup: 'db.t.insertMany([{ createdAt: new Date(Date.now() - 40 * 86400000) }, { createdAt: new Date() }])'
      vars: {collection: t}
  redis:
    support: partial
    commands:
      - cmd: redis-cli --scan --pattern 'app:old:*' | xargs -r -n 100 redis-cli UNLINK
        shell: true
        note:
          zh: 用 SCAN 按模式找出键，每 100 个一批用 UNLINK 删除，不会长时间挡住其他命令
    notes:
      - zh: 没有按条件删除的命令，只能按键名模式找；按时间清理的数据，更好的做法是写入时就设置过期时间。
    refs:
      - {title: 'Redis: UNLINK', url: 'https://redis.io/docs/latest/commands/unlink/'}
      - {title: 'Redis: SCAN', url: 'https://redis.io/docs/latest/commands/scan/'}
    verify:
      setup: |-
        SET app:old:1 a
        SET app:old:2 b
  postgresql:
    support: full
    commands:
      - cmd: DELETE FROM <table> WHERE ctid IN (SELECT ctid FROM <table> WHERE created_at < now() - INTERVAL '30 days' LIMIT 1000);
        note:
          zh: DELETE 没有 LIMIT，用子查询每次删 1000 行，重复执行到没有可删的为止
    notes:
      - zh: 每批之间提交，并留出时间让 VACUUM 回收空间；按时间清理的数据，用分区表直接删掉旧分区最快。
    refs:
      - {title: 'PostgreSQL: DELETE', url: 'https://www.postgresql.org/docs/current/sql-delete.html'}
    verify:
      setup: |-
        CREATE TABLE t (id int PRIMARY KEY, created_at timestamptz);
        INSERT INTO t SELECT g, now() - g * INTERVAL '1 day' FROM generate_series(1, 100) g;
      vars: {table: t}
  tidb:
    support: full
    commands:
      - cmd: DELETE FROM <table> WHERE created_at < NOW() - INTERVAL 30 DAY LIMIT 1000;
      - cmd: BATCH ON id LIMIT 1000 DELETE FROM <table> WHERE created_at < NOW() - INTERVAL 30 DAY;
        note:
          zh: 非事务 DML：按 id 自动切成每批 1000 行，一条语句删完；中途失败时已经删掉的不会回滚
    notes:
      - zh: 单个事务有大小限制（txn-total-size-limit，默认 100MB），一次删太多会报 transaction too large，所以要分批。删掉的空间等 GC 后才回收。
    refs:
      - {title: 'TiDB: BATCH', url: 'https://docs.pingcap.com/tidb/stable/sql-statement-batch/'}
      - {title: 'TiDB: Non-Transactional DML', url: 'https://docs.pingcap.com/tidb/stable/non-transactional-dml/'}
    verify:
      setup: CREATE TABLE t (id INT PRIMARY KEY, created_at DATETIME); INSERT INTO t VALUES (1, NOW() - INTERVAL 40 DAY), (2, NOW());
      vars: {table: t}
related: [ttl-expiry, drop-table]
