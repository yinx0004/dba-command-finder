schema_version: 2
id: set-variable
category: config
title: {zh: 在线修改参数}
summary: {zh: 不重启实例，直接修改一个运行参数。}
keywords:
  zh: [改参数, 修改变量, 动态参数]
  en: [set global, set persist, setparameter]
databases:
  mysql:
    support: full
    commands:
      - cmd: SET GLOBAL <variable> = <value>;
        note: {zh: 重启后失效}
      - cmd: SET PERSIST <variable> = <value>;
        since: '8.0'
        note: {zh: 同时写入 mysqld-auto.cnf，重启后仍然生效}
    refs:
      - title: 'MySQL: SET PERSIST'
        url: https://dev.mysql.com/doc/refman/8.4/en/persisted-system-variables.html
    verify:
      vars: {variable: max_connections, value: '200'}
  mongodb:
    support: partial
    commands:
      - cmd: 'db.adminCommand({ setParameter: 1, <name>: <value> })'
        on: [mongod, mongos, configsvr]
        note: {zh: 重启后失效}
    notes:
      - zh: setParameter 只对当前进程生效。要持久化，得把参数写进配置文件的 setParameter 段，没有 SET PERSIST 这样的命令。
      - zh: 只有允许运行时修改的参数才能改；很多选项（例如 net.maxIncomingConnections）只能改配置文件后重启。
      - zh: 只对执行命令的那一个进程生效。副本集的每个成员、分片集群的每个 mongos、分片成员和 config server 都要分别设置，而且不是每个参数在所有角色上都有（例如 mongos 没有存储引擎参数）。
    refs:
      - title: 'MongoDB: setParameter'
        url: https://www.mongodb.com/docs/manual/reference/command/setParameter/
    verify:
      vars: {name: logLevel, value: '0'}
  redis:
    support: full
    commands:
      - cmd: CONFIG SET <parameter> <value>
        note:
          zh: 立即生效，重启后失效
      - cmd: CONFIG SET slowlog-max-len 256 slowlog-log-slower-than 10000
        since: '7.0'
        note:
          zh: 一次改多个参数，要么都改成功、要么都不改
    notes:
      - zh: 有些参数只能写在配置文件里重启生效，例如 io-threads、daemonize。
    verify:
      vars: {parameter: slowlog-max-len, value: '256'}
      teardown: CONFIG SET slowlog-max-len 128
  postgresql:
    support: full
    commands:
      - cmd: SET <name> = '<value>';
        note:
          zh: 只对当前连接生效
      - cmd: ALTER SYSTEM SET <name> = '<value>';
        note:
          zh: 对整个实例，执行 pg_reload_conf() 或重启后生效
      - cmd: SELECT pg_reload_conf();
    notes:
      - zh: 还可以按用户或按库设置：ALTER ROLE、ALTER DATABASE ... SET。能不能不重启就生效，看 pg_settings 的 context 列。
    verify:
      vars: {name: work_mem, value: 64MB}
      teardown: |-
        ALTER SYSTEM RESET work_mem;
        SELECT pg_reload_conf();
  tidb:
    support: full
    commands:
      - cmd: SET GLOBAL <variable> = <value>;
        note:
          zh: 写进集群，所有 tidb-server 生效，重启后保留（实例级变量除外）
      - cmd: SET CONFIG tikv `<config>` = '<value>';
        on: [tikv]
        note:
          zh: 在线改 TiKV、PD 的配置项；tidb-server 自己的配置项改不了
    verify:
      vars: {variable: tidb_mem_quota_query, value: '2147483648'}
      teardown: SET GLOBAL tidb_mem_quota_query = 1073741824;
related: [show-variables, persist-parameters]
