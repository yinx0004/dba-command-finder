schema_version: 2
id: charset-collation
category: config
title: {zh: 查看字符集和排序规则}
summary: {zh: 出现乱码、排序不对、大小写匹配不一致时，先看字符集和排序规则。}
keywords:
  zh: [字符集, 排序规则, 乱码, 大小写敏感, utf8mb4]
  en: [character_set, collation, utf8mb4, case insensitive]
fields:
  - {id: collation, name: {zh: 排序规则}}
databases:
  mysql:
    support: full
    commands:
      - cmd: SHOW VARIABLES WHERE Variable_name LIKE 'character_set%' OR Variable_name LIKE 'collation%';
        note: {zh: 服务器、库、连接各自的字符集和排序规则}
      - cmd: SELECT TABLE_NAME, TABLE_COLLATION FROM information_schema.TABLES WHERE TABLE_SCHEMA = '<db>';
        note: {zh: 每张表的排序规则}
    fields:
      collation: TABLE_COLLATION
    refs:
      - {title: 'MySQL: Character Sets and Collations', url: 'https://dev.mysql.com/doc/refman/8.4/en/charset.html'}
    verify:
      setup: CREATE TABLE t (id INT PRIMARY KEY, name VARCHAR(20)) DEFAULT CHARSET = utf8mb4;
  mongodb:
    support: partial
    commands:
      - cmd: 'db.getCollectionInfos({ name: "<collection>" })'
        note: {zh: options.collation 是集合的默认排序规则；没有就是按二进制比较}
      - cmd: 'db.<collection>.find().collation({ locale: "zh", strength: 1 })'
        note: {zh: 单次查询指定排序规则；strength 1 表示不区分大小写和重音}
    fields:
      collation: collation
    notes:
      - zh: 字符串一律是 UTF-8，没有字符集要设置。排序规则可以设在集合、索引或单次查询上；默认按二进制比较，所以大小写敏感，中文也不会按拼音排序。
      - zh: 查询要用上索引，查询的 collation 必须和索引的一致。
    refs:
      - {title: 'MongoDB: Collation', url: 'https://www.mongodb.com/docs/manual/reference/collation/'}
    verify:
      setup: 'db.createCollection("t", { collation: { locale: "zh" } }); db.t.insertOne({ name: "张三" })'
      vars: {collection: t}
  redis:
    support: none
    notes:
      - zh: 没有字符集和排序规则：键和值都是二进制安全的字节串，存进去什么字节，读出来就是什么字节，编码由客户端决定。
  postgresql:
    support: full
    commands:
      - cmd: SELECT datname, pg_encoding_to_char(encoding) AS encoding, datcollate, datctype FROM pg_database;
        note:
          zh: 每个库的字符集和排序规则，建库时定下
      - cmd: SHOW server_encoding;
    fields:
      collation: datcollate
    notes:
      - zh: 列和表达式还可以单独指定 COLLATE；换操作系统或 glibc 版本时排序规则可能变，索引要重建。
    refs:
      - {title: 'PostgreSQL: Character Set Support', url: 'https://www.postgresql.org/docs/current/multibyte.html'}
      - {title: 'PostgreSQL: pg_database', url: 'https://www.postgresql.org/docs/current/catalog-pg-database.html'}
  tidb:
    support: full
    commands:
      - cmd: SHOW VARIABLES WHERE Variable_name LIKE 'character_set%' OR Variable_name LIKE 'collation%';
      - cmd: SELECT TABLE_NAME, TABLE_COLLATION FROM information_schema.TABLES WHERE TABLE_SCHEMA = '<db>';
      - cmd: SELECT VARIABLE_VALUE FROM mysql.tidb WHERE VARIABLE_NAME = 'new_collation_enabled';
        note:
          zh: True 表示启用了新的排序规则框架，utf8mb4_general_ci 这类不区分大小写的排序才真正生效
    fields:
      collation: TABLE_COLLATION
    notes:
      - zh: 默认排序规则是 utf8mb4_bin，和 MySQL 8.0 的 utf8mb4_0900_ai_ci 不同；从 MySQL 迁过来时比较、排序和唯一索引的行为可能变。新排序规则框架只能在集群第一次启动前决定，之后改不了。
    refs:
      - {title: 'TiDB: Character Set and Collation', url: 'https://docs.pingcap.com/tidb/stable/character-set-and-collation/'}
    verify:
      setup: CREATE TABLE t (id INT PRIMARY KEY, name VARCHAR(20)) DEFAULT CHARSET = utf8mb4;
related: [show-create-table, time-zone]
