schema_version: 2
id: resize-cache
category: config
title: {zh: 在线调整缓存大小}
summary: {zh: 机器加了内存，或者缓存命中率太低时，不重启实例直接把缓存调大。}
keywords:
  zh: [调整缓存, 缓冲池大小, 加大内存, 在线调整]
  en: [innodb_buffer_pool_size, cache_size, wiredtigerengineruntimeconfig, cachesizegb]
fields:
  - {id: size, name: {zh: 当前缓存上限}}
databases:
  mysql:
    support: full
    commands:
      - cmd: SET GLOBAL innodb_buffer_pool_size = 268435456;
        since: 5.7.5
        note: {zh: 单位字节；会按 chunk 大小取整}
      - cmd: SHOW STATUS LIKE 'Innodb_buffer_pool_resize_status';
        since: 5.7.5
        note: {zh: 调整进度}
    fields:
      size: {name: innodb_buffer_pool_size, skip: {zh: 这两条命令的输出里不带这个名字，用 SELECT @@innodb_buffer_pool_size 确认}}
    notes:
      - zh: 新值会按 innodb_buffer_pool_chunk_size × innodb_buffer_pool_instances 的整数倍取整；缩小时会短暂阻塞。用 SET PERSIST（8.0 起）可以让重启后也生效。
    refs:
      - {title: 'MySQL: Configuring InnoDB Buffer Pool Size', url: 'https://dev.mysql.com/doc/refman/8.4/en/innodb-buffer-pool-resize.html'}
  mongodb:
    support: partial
    commands:
      - cmd: 'db.adminCommand({ setParameter: 1, wiredTigerEngineRuntimeConfig: "cache_size=1G" })'
        on: [mongod, configsvr]
      - cmd: 'db.serverStatus().wiredTiger.cache["maximum bytes configured"]'
        on: [mongod, configsvr]
        note: {zh: 确认当前上限（字节）}
    notes:
      - zh: 只对当前进程生效，重启后恢复为配置文件里的 storage.wiredTiger.engineConfig.cacheSizeGB，记得同时改配置文件。
      - zh: 只有存储数据的 mongod（包括 config server）有数据缓存。mongos 不存数据，没有 WiredTiger 缓存，在 mongos 上执行会报参数不存在；它的内存占用看 db.serverStatus().mem。
    refs:
      - {title: 'MongoDB: WiredTiger Memory Use', url: 'https://www.mongodb.com/docs/manual/core/wiredtiger/#memory-use'}
  redis:
    support: full
    commands:
      - cmd: CONFIG SET maxmemory 1gb
        note:
          zh: 立即生效；调小到比已用内存还小时，会马上按 maxmemory-policy 淘汰键或拒绝写入
      - cmd: CONFIG GET maxmemory
        note:
          zh: 默认 0 表示不限制；已经用了多少看 INFO memory 的 used_memory
    fields:
      size: maxmemory
    notes:
      - zh: maxmemory 是全部数据能用的内存上限，不是单独的一块缓存；到了上限怎么办由 maxmemory-policy 决定，默认 noeviction 是拒绝写入。
    refs:
      - {title: 'Redis: Key eviction', url: 'https://redis.io/docs/latest/develop/reference/eviction/'}
      - {title: 'Redis: CONFIG SET', url: 'https://redis.io/docs/latest/commands/config-set/'}
    verify:
      teardown: CONFIG SET maxmemory 0
  postgresql:
    support: partial
    commands:
      - cmd: SHOW shared_buffers;
      - cmd: ALTER SYSTEM SET shared_buffers = '1GB';
        note:
          zh: 重启后生效
    fields:
      size: shared_buffers
    notes:
      - zh: 改 shared_buffers 必须重启，不能在线调整。读数据还大量依赖操作系统的页缓存，effective_cache_size 告诉优化器大约有多少可用。
    refs:
      - {title: 'PostgreSQL: shared_buffers', url: 'https://www.postgresql.org/docs/current/runtime-config-resource.html#GUC-SHARED-BUFFERS'}
    verify:
      teardown: ALTER SYSTEM RESET shared_buffers;
  tidb:
    support: partial
    commands:
      - cmd: SELECT @@tidb_server_memory_limit;
        note:
          zh: tidb-server 的内存上限，可以写百分比或字节数
      - cmd: SET GLOBAL tidb_server_memory_limit = '70%';
      - cmd: SET CONFIG tikv `storage.block-cache.capacity` = '8GiB';
        on: [tikv]
        note:
          zh: 数据缓存在 TiKV 的 block cache 里，可以在线调大调小
    notes:
      - zh: tidb-server 不缓存数据，innodb_buffer_pool_size 只为兼容保留，设了不起作用。
    refs:
      - {title: 'TiDB: tidb_server_memory_limit', url: 'https://docs.pingcap.com/tidb/stable/system-variables/#tidb_server_memory_limit-span-classversion-marknew-in-v640span'}
      - {title: 'TiDB: Tune TiKV Memory', url: 'https://docs.pingcap.com/tidb/stable/tune-tikv-memory-performance/'}
    verify:
      teardown: SET GLOBAL tidb_server_memory_limit = '80%';
related: [cache-hit-ratio, set-variable]
