schema_version: 2
id: tls-check
category: config
title: {zh: 检查连接是否加密}
summary: {zh: 安全审计时确认服务器是否启用 TLS、是否强制加密，以及当前连接有没有加密。}
keywords:
  zh: [TLS, SSL, 加密连接, 是否加密, 安全审计]
  en: [tls, ssl, ssl_cipher, require_secure_transport, net.tls]
databases:
  mysql:
    support: full
    commands:
      - cmd: SHOW SESSION STATUS LIKE 'Ssl_cipher';
        note: {zh: 当前连接用的加密算法；为空就是没加密}
      - cmd: SELECT @@require_secure_transport;
        since: 5.7.8
        note: {zh: ON 表示拒绝不加密的连接}
    refs:
      - {title: 'MySQL: Using Encrypted Connections', url: 'https://dev.mysql.com/doc/refman/8.4/en/encrypted-connections.html'}
  mongodb:
    support: partial
    commands:
      - cmd: 'db.adminCommand({ getCmdLineOpts: 1 }).parsed.net'
        note: {zh: tls.mode 为 requireTLS 表示强制加密，没有 tls 就是没启用}
    notes:
      - zh: 服务器端只能看配置；当前连接有没有加密要在客户端确认，例如连接串里的 tls=true。
    refs:
      - {title: 'MongoDB: Configure mongod and mongos for TLS/SSL', url: 'https://www.mongodb.com/docs/manual/tutorial/configure-ssl/'}
  redis:
    support: partial
    commands:
      - cmd: CONFIG GET tls-port
        note:
          zh: 0 表示没开 TLS 端口
      - cmd: CONFIG GET tls-auth-clients
        note:
          zh: 是否要求客户端出示证书
    notes:
      - zh: 只能看服务器有没有开 TLS，看不出某个连接是不是走的 TLS；开了 tls-port 后，可以把 port 设成 0，只留加密端口。
    refs:
      - {title: 'Redis: TLS', url: 'https://redis.io/docs/latest/operate/oss_and_stack/management/security/encryption/'}
  postgresql:
    support: full
    commands:
      - cmd: SHOW ssl;
        note:
          zh: 服务器有没有开 TLS
      - cmd: SELECT ssl, version, cipher FROM pg_stat_ssl WHERE pid = pg_backend_pid();
        note:
          zh: 当前这个连接是不是加密的、用的什么协议和算法
    notes:
      - zh: pg_hba.conf 里写 hostssl 的规则只接受加密连接。
    refs:
      - {title: 'PostgreSQL: Secure TCP/IP Connections with SSL', url: 'https://www.postgresql.org/docs/current/ssl-tcp.html'}
      - {title: 'PostgreSQL: pg_stat_ssl', url: 'https://www.postgresql.org/docs/current/monitoring-stats.html#MONITORING-PG-STAT-SSL-VIEW'}
  tidb:
    support: full
    commands:
      - cmd: SHOW SESSION STATUS LIKE 'Ssl_cipher';
        note:
          zh: 值为空表示当前连接没有加密
      - cmd: SELECT @@require_secure_transport;
    notes:
      - zh: 服务端证书在配置文件的 security 段里配置；TiDB 到 TiKV、PD 之间的加密是另一套配置（cluster-ssl-*）。
    refs:
      - {title: 'TiDB: Enable TLS between Clients and Servers', url: 'https://docs.pingcap.com/tidb/stable/enable-tls-between-clients-and-servers/'}
related: [config-file, create-user]
