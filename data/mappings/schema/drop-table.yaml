schema_version: 2
id: drop-table
category: schema
title: {zh: 删除表}
summary: {zh: 删除整张表（集合）和它的数据、索引。}
keywords:
  zh: [删表, 删除表, 删除集合]
  en: [drop table, drop collection]
databases:
  mysql:
    support: full
    commands:
      - cmd: DROP TABLE <table>;
      - cmd: DROP TABLE IF EXISTS <table>;
        note: {zh: 表不存在时只给警告，不报错}
    refs:
      - {title: 'MySQL: DROP TABLE', url: 'https://dev.mysql.com/doc/refman/8.4/en/drop-table.html'}
    verify:
      setup: CREATE TABLE t (id INT PRIMARY KEY);
      vars: {table: t}
  mongodb:
    support: full
    commands:
      - cmd: db.<collection>.drop()
        note: {zh: 集合不存在也不会报错}
    refs:
      - {title: 'MongoDB: db.collection.drop()', url: 'https://www.mongodb.com/docs/manual/reference/method/db.collection.drop/'}
    verify:
      setup: 'db.t.insertOne({ a: 1 })'
      vars: {collection: t}
  redis:
    support: partial
    commands:
      - cmd: UNLINK <key>
        note:
          zh: 删除键，大键的内存在后台释放，不会卡住实例
      - cmd: DEL <key>
        note:
          zh: 同步删除；删除很大的集合时会卡住实例一阵
    notes:
      - zh: 没有表，删除的是单个键；要删一批键，见“分批删除大量数据”。
    verify:
      setup: |-
        HSET app:user:1 name a
        HSET app:user:2 name b
      vars: {key: 'app:user:1'}
      teardown: DEL app:user:1 app:user:2
related: [rename-table]
