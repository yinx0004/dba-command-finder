schema_version: 2
id: list-databases
category: schema
title: {zh: 列出数据库}
summary: {zh: 列出实例上的所有数据库。}
keywords:
  zh: [数据库, 库列表]
  en: [databases, dbs, listdatabases]
databases:
  mysql:
    support: full
    commands:
      - cmd: SHOW DATABASES;
    refs:
      - title: 'MySQL: SHOW DATABASES'
        url: https://dev.mysql.com/doc/refman/8.4/en/show-databases.html
  mongodb:
    support: partial
    commands:
      - cmd: show dbs
        note: {zh: mongosh 命令}
      - cmd: 'db.adminCommand({ listDatabases: 1 })'
        note: {zh: 结果带每个库的 sizeOnDisk}
    notes:
      - zh: 只列出已经有数据的库。MongoDB 的库在第一次写入时才真正创建，use 一个新库不会让它出现在列表里。
      - zh: listDatabases 直接给出每个库的磁盘占用；MySQL 要从 information_schema.TABLES 汇总。
    refs:
      - title: 'MongoDB: listDatabases'
        url: https://www.mongodb.com/docs/manual/reference/command/listDatabases/
  redis:
    support: partial
    commands:
      - cmd: INFO keyspace
        note:
          zh: 只列有数据的库，例如 db0:keys=2,expires=0
      - cmd: CONFIG GET databases
    notes:
      - zh: 库只有编号，没有名字；空的库不会出现在 INFO keyspace 里。
    verify:
      setup: SET app:1 a
      teardown: DEL app:1
related: [list-tables]
