schema_version: 2
id: list-tables
category: schema
title: {zh: 列出表（集合）}
summary: {zh: 列出当前库里的所有表；在 MongoDB 里是集合。}
keywords:
  zh: [表, 集合, 表列表]
  en: [tables, collections, show collections]
databases:
  mysql:
    support: full
    commands:
      - cmd: SHOW TABLES;
      - cmd: SHOW FULL TABLES;
        note: {zh: 多一列 Table_type，区分表和视图}
    refs:
      - title: 'MySQL: SHOW TABLES'
        url: https://dev.mysql.com/doc/refman/8.4/en/show-tables.html
  mongodb:
    support: full
    commands:
      - cmd: show collections
        note: {zh: mongosh 命令}
      - cmd: db.getCollectionNames()
      - cmd: db.getCollectionInfos()
        note: {zh: 每个集合的 type 字段区分集合和视图}
    notes:
      - zh: 两边都会把视图一起列出来。区分类型时，MySQL 看 SHOW FULL TABLES 的 Table_type，MongoDB 看 db.getCollectionInfos() 的 type。
    refs:
      - title: 'MongoDB: db.getCollectionInfos()'
        url: https://www.mongodb.com/docs/manual/reference/method/db.getCollectionInfos/
  redis:
    support: partial
    commands:
      - cmd: SCAN 0 MATCH app:* COUNT 100
        note:
          zh: 按模式分批列出键；返回的第一个值是下一次的游标，回到 0 表示遍历完了
      - cmd: redis-cli --scan --pattern 'app:*'
        shell: true
        note:
          zh: 让 redis-cli 自己翻完所有游标
    notes:
      - zh: 没有表，常见做法是用键名前缀表示“表”，例如 user:1、user:2。不要在生产环境用 KEYS，它会一次遍历所有键，期间挡住其他命令。
    refs:
      - {title: 'Redis: SCAN', url: 'https://redis.io/docs/latest/commands/scan/'}
      - {title: 'Redis: redis-cli', url: 'https://redis.io/docs/latest/develop/tools/cli/'}
    verify:
      setup: |-
        SET app:1 a
        SET app:2 b
      teardown: DEL app:1 app:2
  postgresql:
    support: full
    commands:
      - cmd: SELECT schemaname, tablename FROM pg_tables WHERE schemaname NOT IN ('pg_catalog', 'information_schema');
      - cmd: \dt
        note:
          zh: psql 的快捷命令，只列当前 search_path 里的表；\dt *.* 列所有模式
    refs:
      - {title: 'PostgreSQL: pg_tables', url: 'https://www.postgresql.org/docs/current/view-pg-tables.html'}
      - {title: 'PostgreSQL: psql', url: 'https://www.postgresql.org/docs/current/app-psql.html'}
    verify:
      setup: CREATE TABLE t (id int);
  tidb:
    support: full
    commands:
      - cmd: SHOW TABLES;
      - cmd: SHOW FULL TABLES;
    refs:
      - {title: 'TiDB: SHOW TABLES', url: 'https://docs.pingcap.com/tidb/stable/sql-statement-show-tables/'}
related: [list-databases, show-indexes]
