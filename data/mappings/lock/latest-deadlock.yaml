schema_version: 2
id: latest-deadlock
category: lock
title: {zh: 查看最近一次死锁}
summary: {zh: 找出最近一次死锁里互相等待的两个事务、各自持有和等待的锁，以及被回滚的是哪一个。}
keywords:
  zh: [死锁]
  en: [deadlock, innodb status]
databases:
  mysql:
    support: full
    commands:
      - cmd: SHOW ENGINE INNODB STATUS\G
        note: {zh: 看输出里的 LATEST DETECTED DEADLOCK 段}
      - cmd: SET GLOBAL innodb_print_all_deadlocks = ON;
        note: {zh: 把每一次死锁都写进错误日志，而不只保留最近一次}
    refs:
      - title: 'MySQL: Deadlocks in InnoDB'
        url: https://dev.mysql.com/doc/refman/8.4/en/innodb-deadlocks.html
  mongodb:
    support: none
    notes:
      - zh: WiredTiger 用乐观并发控制：两个操作写同一个文档时，后到的一方立刻得到写冲突，而不是排队等锁，所以不会形成需要检测的死锁，也就没有死锁日志。
      - zh: 普通写操作遇到写冲突由服务端自动重试；多文档事务里则返回 TransientTransactionError，由驱动或应用重试整个事务。
    alternatives:
      - title: {zh: 写冲突累计次数}
        cmd: db.serverStatus().metrics.operation.writeConflicts
      - title: {zh: 单条操作遇到的写冲突}
        note: {zh: 慢日志和 profiler（system.profile）里每条记录的 writeConflicts 字段}
      - title: {zh: 正在等锁的操作}
        see: lock-waits
    refs:
      - title: 'MongoDB: FAQ Concurrency'
        url: https://www.mongodb.com/docs/manual/faq/concurrency/
  redis:
    support: none
    notes:
      - zh: 没有锁，也就没有死锁：命令在单线程里依次执行，MULTI/EXEC 也是一次性执行完。
  postgresql:
    support: partial
    commands:
      - cmd: SELECT datname, deadlocks FROM pg_stat_database WHERE datname IS NOT NULL;
        note:
          zh: 每个库累计发生过多少次死锁
      - cmd: SHOW log_lock_waits;
        note:
          zh: 打开后，等锁超过 deadlock_timeout 会写日志，方便排查
    notes:
      - zh: 死锁的详情（双方的语句和锁）写在服务器日志里，没有视图可以查。
  tidb:
    support: full
    commands:
      - cmd: SELECT * FROM information_schema.CLUSTER_DEADLOCKS;
        note:
          zh: 最近发生的死锁，每个参与的事务一行，同一个死锁的 DEADLOCK_ID 相同
      - cmd: SHOW CONFIG WHERE type = 'tidb' AND name = 'pessimistic-txn.deadlock-history-capacity';
        note:
          zh: 每台 tidb-server 保留最近多少次死锁，默认 10
    notes:
      - zh: 只记录悲观事务（默认）的死锁。乐观事务不等锁，冲突在提交时报错，不算死锁。
related: [lock-waits]
