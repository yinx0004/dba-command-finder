schema_version: 2
id: global-read-lock
category: lock
title: {zh: 加全局只读锁}
summary: {zh: 在做文件级备份或快照前，让实例暂停写入。}
keywords:
  zh: [全局锁, 只读锁, 备份锁, 锁库]
  en: [ftwrl, flush tables with read lock, fsynclock]
databases:
  mysql:
    support: full
    commands:
      - cmd: FLUSH TABLES WITH READ LOCK;
      - cmd: UNLOCK TABLES;
        note: {zh: 解锁}
    refs:
      - title: 'MySQL: FLUSH'
        url: https://dev.mysql.com/doc/refman/8.4/en/flush.html
  mongodb:
    support: partial
    commands:
      - cmd: db.fsyncLock()
        note: {zh: 刷盘并阻塞写入，读不受影响}
      - cmd: db.fsyncUnlock()
        note: {zh: 解锁}
    notes:
      - zh: fsyncLock 是计数的，加了几次就要解锁几次。
      - zh: 锁不随连接断开而释放（FLUSH TABLES WITH READ LOCK 在会话断开时会自动释放），一定要记得执行 db.fsyncUnlock()。
    refs:
      - title: 'MongoDB: db.fsyncLock()'
        url: https://www.mongodb.com/docs/manual/reference/method/db.fsyncLock/
    verify:
      teardown: db.fsyncUnlock()
  redis:
    support: partial
    commands:
      - cmd: CLIENT PAUSE 2000 WRITE
        since: '6.2'
        note:
          zh: 让所有客户端的写命令等待 2000 毫秒，读命令照常，到时间自动恢复
      - cmd: CLIENT UNPAUSE
        since: '6.2'
        note:
          zh: 提前恢复
    notes:
      - zh: 做备份不需要锁：BGSAVE 用 fork 出来的子进程写快照，快照是 fork 那一刻的数据，主进程照常处理读写。
    refs:
      - {title: 'Redis: CLIENT PAUSE', url: 'https://redis.io/docs/latest/commands/client-pause/'}
  postgresql:
    support: none
    notes:
      - zh: 没有全局只读锁，也不需要：pg_dump 用一个事务快照导出，备份期间照常读写。
    alternatives:
      - title: {zh: 让之后的新事务默认只读（用户可以自己改回来）}
        cmd: ALTER SYSTEM SET default_transaction_read_only = on;
    refs:
      - {title: 'PostgreSQL: pg_dump', url: 'https://www.postgresql.org/docs/current/app-pgdump.html'}
  tidb:
    support: none
    notes:
      - zh: 不支持 FLUSH TABLES WITH READ LOCK。备份不需要它：Dumpling 和 BR 都按同一个时间点（TSO）读，天然一致。
    alternatives:
      - title: {zh: 禁止所有写入}
        cmd: SET GLOBAL tidb_super_read_only = ON;
      - title: {zh: 读某个时间点的一致快照}
        cmd: SET @@tidb_snapshot = '2026-01-01 10:00:00';
related: [lock-waits]
