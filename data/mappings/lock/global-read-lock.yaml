schema_version: 2
id: global-read-lock
category: lock
title: {zh: 加全局只读锁}
summary: {zh: 在做文件级备份或快照前，让实例暂停写入。}
keywords:
  zh: [全局锁, 只读锁, 备份锁, 锁库]
  en: [ftwrl, flush tables with read lock, fsynclock]
databases:
  mysql:
    support: full
    commands:
      - cmd: FLUSH TABLES WITH READ LOCK;
      - cmd: UNLOCK TABLES;
        note: {zh: 解锁}
    refs:
      - title: 'MySQL: FLUSH'
        url: https://dev.mysql.com/doc/refman/8.4/en/flush.html
  mongodb:
    support: partial
    commands:
      - cmd: db.fsyncLock()
        note: {zh: 刷盘并阻塞写入，读不受影响}
      - cmd: db.fsyncUnlock()
        note: {zh: 解锁}
    notes:
      - zh: fsyncLock 是计数的，加了几次就要解锁几次。
      - zh: 锁不随连接断开而释放（FLUSH TABLES WITH READ LOCK 在会话断开时会自动释放），一定要记得执行 db.fsyncUnlock()。
    refs:
      - title: 'MongoDB: db.fsyncLock()'
        url: https://www.mongodb.com/docs/manual/reference/method/db.fsyncLock/
    verify:
      teardown: db.fsyncUnlock()
  redis:
    support: partial
    commands:
      - cmd: CLIENT PAUSE 2000 WRITE
        since: '6.2'
        note:
          zh: 让所有客户端的写命令等待 2000 毫秒，读命令照常，到时间自动恢复
      - cmd: CLIENT UNPAUSE
        since: '6.2'
        note:
          zh: 提前恢复
    notes:
      - zh: 做备份不需要锁：BGSAVE 用 fork 出来的子进程写快照，快照是 fork 那一刻的数据，主进程照常处理读写。
related: [lock-waits]
