# What a DBA types → which mapping must come first.
#   top: <id>          the first result must be this id
#   top_any: [ids]     the first result must be one of these
#   empty: true        nothing should match
# Add a line here whenever a search surprises you.

- {q: 'show full processlist;', top: list-active-sessions}
